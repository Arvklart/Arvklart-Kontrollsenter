function legalForm(l, isNew) {
  openForm({ title: isNew ? "Nytt juridisk spørsmål" : "Juridisk spørsmål", value: l,
    fields: [{ k: "question", label: "Usikkerhetsmoment", type: "textarea", full: true, ph: "Hva er vi usikre på?" },
      { k: "status", label: "Status", type: "select", opts: LEGAL_STATUS }, { k: "owner", label: "Ansvarlig", type: "select", opts: personOpts() },
      { k: "findings", label: "Hva vi har funnet ut", type: "textarea", full: true, ph: "Svar, kilder og hvem vi har snakket med" },
      { k: "next", label: "Neste steg", full: true }, ...attachFields(l)],
    onSave: async v => {
      if (!v.question) return formError("Skriv hva dere er usikre på.");
      const o = Object.assign(clone(l), v); const err = await applyAttach(o, v); if (err) return formError(err);
      o.updated = todayISO(); put("legal", o); closeModal(); toast(o.status === "Avklart" && l.status !== "Avklart" ? "Avklart. Godt jobbet!" : "Lagret.");
    },
    onDelete: isNew ? null : () => { del("legal", l.id); closeModal(); } });
}
function cdocForm(d, isNew) {
  openForm({ title: isNew ? "Nytt selskapsdokument" : "Selskapsdokument", value: d,
    fields: [{ k: "title", label: "Dokument", full: true, ph: "F.eks. Aksjonæravtale" }, { k: "kind", label: "Type", type: "select", opts: CDOC_KINDS },
      { k: "status", label: "Status", type: "select", opts: [["", "Avklares"], ...CDOC_STATUS.map(s => [s, s])] },
      { k: "parties", label: "Parter" }, { k: "date", label: "Dato (inngått eller signert)", type: "date" },
      { k: "owner", label: "Ansvarlig", type: "select", opts: personOpts() }, { k: "note", label: "Notat", type: "textarea", full: true }, ...attachFields(d)],
    onSave: async v => {
      if (!v.title) return formError("Dokumentet trenger et navn.");
      const o = Object.assign(clone(d), v); const err = await applyAttach(o, v); if (err) return formError(err);
      put("companyDocs", o); closeModal(); toast("Dokumentet er lagret.");
    },
    onDelete: isNew ? null : () => { del("companyDocs", d.id); closeModal(); } });
}
function companyForm() {
  const info = clone((S.company || {}).info || { id: "info" });
  openForm({ title: "Selskapsinformasjon", value: info,
    fields: COMPANY_FIELDS.map(([k, l]) => ({ k, label: l, type: ["owners", "board", "notes"].includes(k) ? "textarea" : "text", full: ["owners", "board", "notes", "address"].includes(k) })),
    onSave: v => { put("company", Object.assign(info, v, { id: "info" })); closeModal(); toast("Selskapsinformasjonen er lagret."); } });
}

/* ----- ØKONOMI ----- */
VIEWS.okonomi = function () {
  const set = S.meta.settings || { totalBudget: 0, totalNote: "" };
  const items = arr("budget").sort((a, b) => (a.n || 99) - (b.n || 99));
  let sb = 0, sa = 0, missing = false;
  const rows = items.map(b => {
    const bud = b.budget == null || b.budget === "" ? null : Number(b.budget); const linked = linkedSpend(b.id); const act = num(b.actual) + linked;
    if (bud == null) missing = true; else sb += bud; sa += act;
    return `<tr data-act="editBudget" data-id="${b.id}"><td>${esc(b.post)}${b.note ? `<div class="muted" style="font-size:12px">${ph(b.note)}</div>` : ""}</td>
      <td class="num">${bud == null ? '<span class="ph">[FYLL INN]</span>' : kr(bud)}</td><td class="num">${kr(act)}${linked ? `<div class="muted" style="font-size:11px">${kr(linked)} fra utlegg/lommebok</div>` : ""}</td>
      <td class="num">${bud == null ? "–" : `<span style="color:${bud - act < 0 ? "var(--red-ink)" : "inherit"}">${kr(bud - act)}</span>`}</td><td><span class="pill s-${esc(b.status)}">${esc(b.status)}</span></td></tr>`;
  }).join("");
  const table = `<div class="card"><div class="card-head"><div><h2>Budsjett</h2><p class="sub">Total ramme: <b class="mono">${kr(set.totalBudget)}</b> ${ph(set.totalNote)} · <button class="mini" data-act="editSettings">Endre ramme</button></p></div></div>
    <div class="tablewrap"><table><thead><tr><th>Post</th><th class="num">Budsjett</th><th class="num">Faktisk</th><th class="num">Gjenstående</th><th>Status</th></tr></thead>
    <tbody>${rows || `<tr><td colspan="5" class="muted">Ingen poster ennå.</td></tr>`}</tbody>
    <tfoot><tr><td>Sum</td><td class="num">${kr(sb)}${missing ? ' <span class="ph">+ [FYLL INN]</span>' : ""}</td><td class="num">${kr(sa)}</td><td class="num">${missing ? "–" : kr(sb - sa)}</td><td></td></tr>
    ${totalSpent() - sa > 0 ? `<tr><td>Forbruk uten budsjettpost</td><td></td><td class="num">${kr(totalSpent() - sa)}</td><td></td><td></td></tr>` : ""}
    <tr><td>Ufordelt av ramme</td><td class="num">${kr(set.totalBudget - sb)}</td><td></td><td class="num">${kr(set.totalBudget - totalSpent())}</td><td class="muted" style="font-weight:400">igjen av ramme</td></tr></tfoot></table></div></div>`;
  const steps = arr("funding").sort((a, b) => a.step - b.step || a.n - b.n);
  const maxStep = Math.max(0, ...steps.map(s => s.step));
  const stairs = steps.map(f => `<div class="stair" data-act="editFund" data-id="${f.id}" style="margin-bottom:${f.step * 22}px">
    <span class="eyebrow">Trinn ${f.step}</span><b>${esc(f.name)}</b><div class="amt">${f.amount ? ph(f.amount) : '<span class="muted">Beløp ikke oppgitt</span>'}</div>
    <div><span class="pill s-${esc(f.status)}">${esc(f.status)}</span></div>
    <dl><dt>Frist</dt><dd>${f.deadline ? ph(f.deadline) : "–"}</dd><dt>Ansvarlig</dt><dd>${ownerText(f.owner)}</dd>${f.req ? `<dt>Krav</dt><dd>${ph(f.req)}</dd>` : ""}</dl></div>`).join("");
  return walletView() + table + `<div class="card"><div class="card-head"><div><h2>Finansieringsstigen</h2><p class="sub">Fra små lokale midler til Innovasjon Norge. Hvert trinn bygger på det forrige.</p></div><button class="btn ghost" data-act="newFund">${ico("plus")}Nytt trinn</button></div>
    <div class="stairs" style="padding-top:${maxStep * 4}px">${stairs}</div></div>`;
};

function walletView() {
  const bal = walletBalance(), inn = walletIn(), ut = walletOut(), owed = outstanding();
  const ex = arr("expenses").sort((a, b) => (b.date || "").localeCompare(a.date || ""));
  const balCard = `<div class="card wallet-card"><span class="eyebrow">Lommebok · saldo</span>
    <div class="bignum mono-big" style="margin:8px 0 6px;color:${bal < 0 ? "var(--red-ink)" : "var(--ink)"}">${kr(bal)}</div>
    <p class="sub" style="margin:0">Inn <b class="mono">${kr(inn)}</b> · Ut <b class="mono">${kr(ut)}</b></p>
    <div class="wallet-lines">
      <div><span>Utestående utlegg</span><b class="mono" style="color:${owed ? "var(--orange-ink)" : "inherit"}">${kr(owed)}</b></div>
      <div><span>Saldo etter refusjoner</span><b class="mono" style="color:${bal - owed < 0 ? "var(--red-ink)" : "inherit"}">${kr(bal - owed)}</b></div></div>
    <div class="row-btns"><button class="btn" data-act="newTx" data-t="Inn">${ico("plus")}Innbetaling</button><button class="btn ghost" data-act="newTx" data-t="Ut">${ico("plus")}Utbetaling</button></div></div>`;
  const people = PEOPLE.map(p => {
    const mine = ex.filter(e => e.person === p);
    const paid = mine.reduce((s, e) => s + num(e.amount), 0), back = mine.filter(e => e.status === "Refundert").reduce((s, e) => s + num(e.amount), 0), due = paid - back;
    return `<div class="trow">${avatar(p)}<span class="tn">${p}<small class="muted" style="display:block;font-size:12px">Lagt ut ${kr(paid)} · refundert ${kr(back)}</small></span>
      <span class="badge ${due > 0 ? "t-orange" : paid ? "t-green" : "t-none"}">${due > 0 ? "Til gode " + kr(due) : paid ? "Gjort opp" : "Ingen utlegg"}</span></div>`;
  }).join("");
  const whoCard = `<div class="card"><div class="card-head"><div><h2>Hvem har lagt ut</h2><p class="sub">Det hver enkelt har betalt selv, og hva de har til gode.</p></div><button class="btn" data-act="newExpense">${ico("plus")}Nytt utlegg</button></div><div class="team">${people}</div></div>`;
  const exRows = ex.map(e => `<tr data-act="editExpense" data-id="${e.id}"><td class="mono" style="white-space:nowrap">${e.date ? fmtDate(e.date) : "–"}</td>
    <td><span style="display:inline-flex;gap:8px;align-items:center">${avatar(e.person, true)}${esc(e.person || "–")}</span></td>
    <td style="min-width:180px">${esc(e.what)}${e.note ? `<div class="muted" style="font-size:12px">${esc(e.note)}</div>` : ""}</td>
    <td>${e.post ? `<span class="tag">${esc(postName(e.post))}</span>` : '<span class="muted">–</span>'}</td>
    <td class="num">${kr(e.amount)}</td>
    <td>${e.status === "Refundert" ? '<span class="pill s-Refundert">Refundert</span>' : `<button class="mini" data-act="refundExpense" data-id="${e.id}">Refunder fra lommeboka</button>`}</td></tr>`).join("");
  const exCard = `<div class="card"><div class="card-head"><div><h2>Utlegg</h2><p class="sub">Kjøp noen i teamet har betalt selv. «Refunder» trekker beløpet fra lommeboka og merker utlegget som gjort opp.</p></div></div>
    ${ex.length ? `<div class="tablewrap"><table><thead><tr><th>Dato</th><th>Hvem</th><th>Hva</th><th>Budsjettpost</th><th class="num">Beløp</th><th>Status</th></tr></thead><tbody>${exRows}</tbody>
      <tfoot><tr><td colspan="4">Sum utlegg</td><td class="num">${kr(ex.reduce((s, e) => s + num(e.amount), 0))}</td><td>${owed ? kr(owed) + " utestående" : "Alt refundert"}</td></tr></tfoot></table></div>`
      : `<div class="empty">Ingen utlegg ennå. Har noen betalt noe selv, registrer det med «Nytt utlegg».</div>`}</div>`;
  let run = 0;
  const txs = arr("wallet").sort((a, b) => (a.date || "").localeCompare(b.date || "") || (a.created || "").localeCompare(b.created || ""))
    .map(w => { run += w.type === "Inn" ? num(w.amount) : -num(w.amount); return { w, run }; }).reverse();
  const txRows = txs.map(({ w, run }) => `<tr data-act="editTx" data-id="${w.id}"><td class="mono" style="white-space:nowrap">${w.date ? fmtDate(w.date) : "–"}</td>
    <td style="min-width:200px">${esc(w.text)}${w.expenseId ? ' <span class="tag">Refusjon</span>' : ""}</td><td>${esc(w.by || "–")}</td>
    <td>${w.post ? `<span class="tag">${esc(postName(w.post))}</span>` : '<span class="muted">–</span>'}</td>
    <td class="num" style="color:var(--green-ink)">${w.type === "Inn" ? "+" + kr(w.amount) : ""}</td><td class="num" style="color:var(--red-ink)">${w.type !== "Inn" ? "−" + kr(w.amount) : ""}</td><td class="num">${kr(run)}</td></tr>`).join("");
  const txCard = `<div class="card"><div class="card-head"><div><h2>Bevegelser i lommeboka</h2><p class="sub">Innbetalinger (f.eks. tilskudd) og utbetalinger. Nyeste øverst.</p></div></div>
    ${txs.length ? `<div class="tablewrap"><table><thead><tr><th>Dato</th><th>Beskrivelse</th><th>Registrert av</th><th>Budsjettpost</th><th class="num">Inn</th><th class="num">Ut</th><th class="num">Saldo</th></tr></thead><tbody>${txRows}</tbody></table></div>`
      : `<div class="empty">Ingen bevegelser ennå. Legg inn startsaldo eller første innbetaling med «Innbetaling».</div>`}</div>`;
  return `<div class="grid-wallet">${balCard}${whoCard}</div>${exCard}${txCard}`;
}

/* ----- HYPOTESER ----- */
function evi(e) { const i = Math.max(0, EVIDENCE.indexOf(e)); return `<span class="evi" title="Evidensstyrke: ${esc(e)}">${[0, 1, 2].map(k => `<i class="${k <= i ? "on" : ""}"></i>`).join("")}<span>${esc(e)}</span></span>`; }
VIEWS.hypoteser = function () {
  const hs = arr("hypotheses").sort((a, b) => (a.n || 99) - (b.n || 99));
  const method = `<div class="card"><h2>Slik tester vi</h2><p class="sub">Kursmetoden: vi bestemmer på forhånd hva som skal til for å ta feil, så evidensen får avgjøre.</p>
    <div class="method"><div><b>1</b>Formuler hypotesen</div><div><b>2</b>Definer på forhånd hva som motbeviser den</div><div><b>3</b>Test med ekte familier og partnere</div><div><b>4</b>La evidensen avgjøre: fortsett, pivot eller parker</div></div></div>`;
  const cards = hs.map(h => `<div class="card hyp" data-act="editHyp" data-id="${h.id}">
    <div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start"><div><span class="eyebrow">Hypotese ${h.n}</span><h2 style="margin-top:3px">${ph(h.title)}</h2></div><span class="pill s-${esc(h.status)}">${esc(h.status)}</span></div>
    <dl><div><dt>Motbevist hvis</dt><dd>${ph(h.falsifier) || '<span class="muted">–</span>'}</dd></div>
      <div><dt>Test</dt><dd>${ph(h.test) || '<span class="muted">–</span>'}</dd></div>
      <div><dt>Resultat</dt><dd>${ph(h.result) || '<span class="muted">Ikke testet ennå</span>'}</dd></div></dl>
    <div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;border-top:1px solid var(--line);padding-top:12px">
      <div><span class="eyebrow" style="display:block;margin-bottom:4px">Evidensstyrke</span>${evi(h.evidence)}</div>
      <div style="text-align:right"><span class="eyebrow" style="display:block;margin-bottom:4px">Beslutning</span>${h.decision ? `<span class="pill">${esc(h.decision)}</span>` : '<span class="muted">Ikke tatt</span>'}</div></div></div>`).join("");

};

/* ----- INTERVJUER ----- */

/* ----- MØTER ----- */

      <div><span class="eyebrow" style="display:block;margin-bottom:6px">Actionpunkter</span><div class="actions">${(m.actions || []).map(a => `<div class="action"><span>${esc(a.text)}</span>${a.taskId && S.tasks[a.taskId] ? `<button class="mini done" data-act="editTask" data-id="${a.taskId}" style="cursor:pointer">${S.tasks[a.taskId].status === "Ferdig" ? "Ferdig" : "Oppgave opprettet"}</button>` : `<button class="mini" data-act="actionToTask" data-mid="${m.id}" data-aid="${a.id}">Opprett oppgave</button>`}</div>`).join("") || '<p class="muted">Ingen.</p>'}</div></div></div></div>`;

};

/* =====================================================================
   OMRÅDER, KONTAKTER OG KUNNSKAPSBASE
   ===================================================================== */
const AREA = Object.fromEntries(AREAS.map(a => [a.id, a]));
const areaName = id => (AREA[id] || {}).name || "";
const areaTag = id => id && AREA[id] ? `<span class="tag atag">${esc(AREA[id].short)}</span>` : "";
function lightPill(key) { const [label, tone] = LIGHTS[key || ""] || LIGHTS[""]; return `<span class="light t-${tone}"><i></i>${label}</span>`; }
function areaTasks(id) { return tasks().filter(t => !isDone(t) && t.area === id).sort(byPrioDue); }
const contactsIn = id => arr("contacts").filter(c => (c.areas || []).includes(id));
const contactName = id => (S.contacts[id] || {}).name || "";
const searchKey = (...xs) => esc(xs.flat().filter(Boolean).join(" ").toLowerCase());
const isUrl = u => /^https?:\/\//i.test(u || "");
const CONTACT_TONE = { "Bør kontaktes": "t-orange", "Kontaktet": "t-none", "I dialog": "t-green", "Avtale på plass": "t-green", "Ikke aktuell": "t-none" };
const ITEM_TONE = { "I løsningen": "t-green", "Under utvikling": "t-orange", "Vurderes": "t-none", "Droppet": "t-none", "Ferdig": "t-green", "Pågår": "t-orange", "Venter på svar": "t-orange", "Ikke startet": "t-none" };
const itemBadge = i => i.status ? `<span class="badge ${ITEM_TONE[i.status] || "t-none"}">${esc(i.status)}</span>` : `<span class="ph">[BEKREFT status]</span>`;
const PEDGE = { Kritisk: "var(--red)", "Høy": "var(--orange)", Middels: "#C9AE6B", Lav: "#A9B89D" };

function areaFacts(id) {
  const f = [], open = areaTasks(id), od = open.filter(t => t.due && daysUntil(t.due) < 0).length;
  f.push([open.length, open.length === 1 ? "åpen oppgave" : "åpne oppgaver"]);
  if (od) f.push([od, "forfalt", "red"]);
  if (id === "produkt") {
    const it = arr("items").filter(i => i.kind === "funksjon");
    FEATURE_STATUS.forEach(s => f.push([it.filter(i => i.status === s).length, s.toLowerCase()]));
    const un = it.filter(i => !FEATURE_STATUS.includes(i.status)).length; if (un) f.push([un, "må plasseres", "ph"]);
  }
  if (id === "marked") { f.push([`${paying().length}/${PILOT_GOAL}`, "betalende familier"]); f.push([arr("leads").length, "leads"]); }
  if (id === "jus") f.push([arr("items").filter(i => i.kind === "sak" && i.area === "jus" && i.status !== "Ferdig").length, "åpne saker"]);
  if (id === "finans") { f.push([kr(walletBalance()), "i lommeboka"]); const o = outstanding(); if (o) f.push([kr(o), "utestående utlegg", "orange"]); }
  if (id === "research") {
    const iv = arr("interviews"), hs = arr("hypotheses");
    f.push([arr("knowledge").length, "kunnskapsnotater"]);
    f.push([`${iv.filter(i => i.findings && !hasPh(i.findings)).length}/${iv.length}`, "intervjuer utfylt"]);
    f.push([`${hs.filter(h => h.status && h.status !== "Ikke testet").length}/${hs.length}`, "hypoteser testet"]);
  }
  if (id === "kurs") { const m = milestones().find(m => m.type === "Innlevering" && m.status !== "Levert" && m.date); if (m) { const d = daysUntil(m.date); f.push([d + " d", "til " + m.title, d <= 7 ? "orange" : ""]); } }
  if (id !== "kurs") { const cs = contactsIn(id).length; f.push([cs, cs === 1 ? "kontakt" : "kontakter"]); }
  return f;
}
const factsHtml = (id, max) => `<div class="facts">${areaFacts(id).slice(0, max || 99).map(([n, l, tone]) => `<span class="fact${tone ? " f-" + tone : ""}"><b>${n}</b> ${esc(l)}</span>`).join("")}</div>`;

const AREA_TABS = Object.fromEntries(AREAS.map(a => [a.id, [["oversikt", "Oversikt"], ...(SUBS[a.id] || [])]]));
const subName = (area, sub) => ((SUBS[area] || []).find(s => s[0] === sub) || [])[1] || "";
function taskAreaTag(t) { return t.area && AREA[t.area] ? `<span class="tag atag">${esc(AREA[t.area].short)}${t.sub && subName(t.area, t.sub) ? " › " + esc(subName(t.area, t.sub)) : ""}</span>` : ""; }

/* Én oppgaveliste som brukes overalt. Samme oppgave, samme data: krysser du av her, er den ferdig alle steder. */
function taskRows(list, opts = {}) {
  return list.map(t => {
    const own = ownersOf(t), done = isDone(t), todo = t.status === "Må gjøres";
    const step = todo ? (own.length ? "Start" : "Ta oppgaven") : NEXT_STEP[t.status][1];
    const tag = opts.hideTag ? "" : opts.subOnly ? (t.sub && subName(t.area, t.sub) ? `<span class="tag atag">${esc(subName(t.area, t.sub))}</span>` : "") : taskAreaTag(t);
    return `<div class="trow2${done ? " done" : ""}" style="border-left-color:${done ? "var(--green)" : PEDGE[t.prio] || "var(--line)"}">
      <button class="ring${done ? " on" : ""}" data-act="toggleDone" data-id="${t.id}" aria-label="${done ? "Marker som ikke ferdig" : "Marker som ferdig"}">${ico("check", 3)}</button>
      <div class="tr-main"><div class="ft" data-act="editTask" data-id="${t.id}">${ph(t.title)}</div>
        <div class="fm">${dueBadge(t)}${tag}<span class="pill s-${esc(t.status)}">${esc(t.status)}</span>${own.length ? `<span>${esc(joinNames(own))}</span>` : ""}</div></div>
      <div class="tr-act"><button class="avbtn" data-act="assign" data-id="${t.id}" aria-label="Endre ansvarlige" title="${own.length ? "Ansvarlig: " + esc(joinNames(own)) : "Ikke fordelt"}">${avatars(t, true)}</button>
      <button class="mini${done ? " ghosty" : ""}" data-act="nextStep" data-id="${t.id}">${t.status === "Pågår" ? ico("check", 2.4) : ""}${step}${todo ? " " + ico("right", 2.4) : ""}</button></div></div>`;
  }).join("");
}
function tasksBlock(all, opts) {
  const open = all.filter(t => !isDone(t)).sort(byPrioDue), done = all.filter(isDone);
  return `<div class="card"><div class="card-head"><div><h2>${opts.title || "Oppgaver"}</h2><p class="sub">${open.length} åpne${done.length ? ` · ${done.length} ferdig` : ""}. Endringer her gjelder alle steder oppgaven vises.</p></div>
      ${miniBtn("newTaskIn", "+ Oppgave", `data-area="${opts.area || ""}" data-sub="${opts.sub || ""}"`)}</div>
    <div class="mini-list">${taskRows(open, opts) || '<div class="empty">Ingen åpne oppgaver.</div>'}</div>
    ${done.length ? `<details class="done-list"><summary>Ferdige oppgaver (${done.length})</summary><div class="mini-list">${taskRows(done, opts)}</div></details>` : ""}</div>`;
}
function subTasks(area, sub) {
  const all = tasks().filter(t => t.area === area && t.sub === sub);
  if (!all.length) return `<p class="quiet">Ingen oppgaver under ${esc(subName(area, sub).toLowerCase())} ennå. ${miniBtn("newTaskIn", "+ Oppgave", `data-area="${area}" data-sub="${sub}"`)}</p>`;
  return tasksBlock(all, { area, sub, hideTag: true });
}
function areaView(id) {
  const tabs = AREA_TABS[id], sub = tabs.some(t => t[0] === UI.sub) ? UI.sub : "oversikt";
  const tabHtml = tabs.length > 1 ? `<div class="tabs" role="tablist">${tabs.map(([k, l]) => `<button class="tab${sub === k ? " on" : ""}" data-act="tab" data-t="${k}" role="tab" aria-selected="${sub === k}">${l}</button>`).join("")}</div>` : "";
  if (sub === "oversikt") return tabHtml + areaOverview(id);
  const body = { salg: VIEWS.salg, pilot: pilotView, jus: legalView, selskap: selskapView, okonomi: VIEWS.okonomi, kunnskap: knowledgeView, hyp: VIEWS.hypoteser, int: VIEWS.intervjuer }[sub]();
  return tabHtml + (["pilot", "jus", "selskap"].includes(sub) ? body + subTasks(id, sub) : subTasks(id, sub) + body);
}
function cardBox(title, sub, inner, foot) {
  return `<div class="card"><div class="card-head"><div><h2>${title}</h2>${sub ? `<p class="sub">${sub}</p>` : ""}</div></div>${inner}${foot ? `<div class="card-foot">${foot}</div>` : ""}</div>`;
}
const miniBtn = (act, label, attrs = "") => `<button class="mini" data-act="${act}" ${attrs}>${label}</button>`;

/* Områdeside: status øverst, så det som er viktig for området, og bare de delene som har innhold */
function areaOverview(id) {

    `<div class="mini-list">${saker.map(i => `<div class="lrow" data-act="editItem" data-id="${i.id}"><span class="lt"><b>${esc(i.title)}</b><small>${ph(i.summary || "")}${i.next ? `${i.summary ? " · " : ""}Neste: ${esc(i.next)}` : ""}${i.owner ? ` · ${esc(i.owner)}` : ""}</small></span>${itemBadge(i)}</div>`).join("") || '<div class="empty">Ingen saker ennå.</div>'}</div>`,

  return statusCard + main + tasksBox + noTasks + sakerBox + extrasCard(id);

/* Kontakter, beslutninger og dokumenter i ett kort, bare de delene som har innhold */

/* Marked & Salg: grafer */
function marketCharts() {
  const leads = arr("leads"), active = leads.filter(l => l.stage !== "Tapt"), pay = paying().length;
  const rev = paying().reduce((s, l) => s + num(l.price), 0);
  const fun = STAGES.slice(0, 5), reached = fun.map((s, i) => active.filter(l => STAGES.indexOf(l.stage) >= i).length), mx = Math.max(1, reached[0]);
  const funnel = fun.map((s, i) => `<div class="frow"><span class="fl">${s}</span><div class="ftrack"><i style="width:${Math.max(reached[i] ? 6 : 0, reached[i] / mx * 100)}%;opacity:${1 - i * 0.12}"></i></div><b class="mono">${reached[i]}</b><span class="fc mono">${i && reached[i - 1] ? Math.round(reached[i] / reached[i - 1] * 100) + " %" : ""}</span></div>`).join("");
  const src = [...SOURCES, ""].map(s => [s || "Ikke oppgitt", leads.filter(l => (l.source || "") === s).length]).filter(([s, n]) => n || s !== "Ikke oppgitt");
  const smx = Math.max(1, ...src.map(x => x[1]));
  const sources = src.map(([s, n]) => `<div class="hb"><span>${esc(s)}</span><div class="hb-track"><i style="width:${n / smx * 100}%"></i></div><b class="mono">${n}</b></div>`).join("");
  const lost = leads.filter(l => l.stage === "Tapt").length;
  return `<div class="card"><div class="card-head"><div><h2>Salg i tall</h2><p class="sub">${leads.length ? `${leads.length} leads totalt${lost ? `, ${lost} tapt` : ""}` : "Grafene fylles når dere legger inn den første leaden under «Salg»."}</p></div><div class="row-btns">${miniBtn("go", "Salg", 'data-p="marked.salg"')}${miniBtn("go", "Pilot", 'data-p="marked.pilot"')}</div></div>
    <div class="tiles t3">
      <section class="gt"><span class="eyebrow">Pilotmål</span>${pilotDots(pay)}<div class="gt-big"><b class="mono">${pay}</b> av ${PILOT_GOAL} betaler</div><p class="sub">${kr(rev)} i omsetning${pay ? ` · snitt ${kr(rev / pay)}` : ""}</p></section>
      <section class="gt"><span class="eyebrow">Salgstrakt</span><div class="funnel">${funnel}</div><p class="sub">Hvor mange som har nådd hvert steg, og andel som gikk videre.</p></section>
      <section class="gt"><span class="eyebrow">Leads per kilde</span><div class="hbars">${sources}</div></section>
    </div></div>`;
}

/* Finansiering & Admin */

/* ---------- Skjema-modal ---------- */
const modalEl = document.getElementById("modal");
let modalCtx = null;
function fieldHtml(f, v) {
  const id = "f-" + f.k, cls = f.full ? "fl full" : "fl";
  const hint = f.hint ? `<span class="hint muted">${f.hint}</span>` : "";
  if (f.type === "file") return `<label class="${cls}">${f.label}<input type="file" id="${id}" accept="${esc(f.accept || "")}">${hint}</label>`;
  if (f.type === "textarea") return `<label class="${cls}">${f.label}<textarea id="${id}" ${f.ph ? `placeholder="${esc(f.ph)}"` : ""}>${esc(v)}</textarea>${hint}</label>`;
  if (f.type === "select") return `<label class="${cls}">${f.label}<select id="${id}">${f.opts.map(o => { const [val, lab] = Array.isArray(o) ? o : [o, o || "–"]; return `<option value="${esc(val)}"${String(v ?? "") === String(val) ? " selected" : ""}>${esc(lab)}</option>`; }).join("")}</select>${hint}</label>`;
  if (f.type === "check") return `<label class="${cls}"><span class="checks"><label><input type="checkbox" id="${id}"${v ? " checked" : ""}> ${f.text || f.label}</label></span>${hint}</label>`;
  if (f.type === "multi") return `<div class="${cls}" style="display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:600;color:var(--muted)">${f.label}<span class="checks">${f.opts.map(([val, lab]) => `<label><input type="checkbox" name="${id}" value="${esc(val)}"${(v || []).includes(val) ? " checked" : ""}> ${esc(lab)}</label>`).join("")}</span>${hint}</div>`;
  return `<label class="${cls}">${f.label}<input type="${f.type || "text"}" id="${id}" value="${esc(v ?? "")}" ${f.type === "number" ? 'step="any" min="0" inputmode="decimal"' : ""} ${f.ph ? `placeholder="${esc(f.ph)}"` : ""}>${hint}</label>`;
}
function openForm({ title, fields, value, onSave, onDelete, extra }) {
  modalCtx = { fields, value, onSave, onDelete };
  modalEl.innerHTML = `<div class="modal-bg" data-act="modalBg"><div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}">
    <h3>${esc(title)}</h3><form class="form" id="mform">${fields.map(f => fieldHtml(f, value[f.k])).join("")}<div id="form-err" hidden class="form-err"></div>${extra || ""}</form>
    <div class="modal-foot">${onDelete ? `<div class="confirm-row" id="delrow"><button class="btn danger" data-act="askDelete">Slett</button></div>` : ""}
    <div class="r"><button class="btn ghost" data-act="closeModal">Avbryt</button><button class="btn" data-act="saveModal">Lagre</button></div></div></div></div>`;
  const first = modalEl.querySelector("input[type=text],textarea"); if (first) first.focus();
}
function readForm() {
  const out = {};
  for (const f of modalCtx.fields) {
    const id = "f-" + f.k;
    if (f.type === "multi") out[f.k] = [...modalEl.querySelectorAll(`input[name="${id}"]:checked`)].map(i => i.value);
    else if (f.type === "check") out[f.k] = document.getElementById(id).checked;
    else if (f.type === "file") out[f.k] = document.getElementById(id).files[0] || null;
    else if (f.type === "number") { const v = document.getElementById(id).value.trim().replace(",", "."); out[f.k] = v === "" ? null : Number(v); }
    else if (f.type === "date") out[f.k] = document.getElementById(id).value || null;
    else out[f.k] = document.getElementById(id).value.trim();
  }
  return out;
}
function formError(msg) { const e = document.getElementById("form-err"); e.textContent = msg; e.hidden = false; }
function closeModal() { modalEl.innerHTML = ""; modalCtx = null; }

/* Flytt en oppgave. Til «Pågår» eller «Ferdig» må den ha minst én ansvarlig. */
function moveTask(t, to) {
  if (t.status === to) return;

    <div class="modal-foot"><div class="confirm-row" id="io-confirm"></div><div class="r"><button class="btn ghost" data-act="closeModal">Avbryt</button><button class="btn" data-act="checkImport">Importer</button></div></div></div></div>`;
  document.getElementById("io-file").addEventListener("change", e => { const f = e.target.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => { document.getElementById("io-text").value = r.result; }; r.readAsText(f); });
}
let pendingImport = null;
function checkImport() {
  const err = document.getElementById("io-err"); err.hidden = true;
  try {
    const j = JSON.parse(document.getElementById("io-text").value); const d = j.data || j;
    if (!d.tasks || !Array.isArray(d.tasks)) throw new Error();
    pendingImport = d;
    document.getElementById("io-confirm").innerHTML = `<span>Erstatte alle data med ${d.tasks.length} oppgaver?</span><button class="btn danger" data-act="doImport">Ja, erstatt</button>`;
  } catch (e) { err.textContent = "Fant ikke gyldige data. Lim inn hele JSON-teksten fra «Eksporter data»."; err.hidden = false; }
}
async function doImport() {
  const d = pendingImport; if (!d) return;
  closeModal(); setSync("Importerer …", "");
  try {
    const rows = [];
    for (const c of COLLS) {
      const incoming = (d[c] || []).filter(x => x && x.id != null).map(x => Object.assign(clone(x), { id: String(x.id) }));
      const ids = new Set(incoming.map(x => x.id));
      const gone = Object.keys(S[c] || {}).filter(id => !ids.has(id));
      for (let i = 0; i < gone.length; i += 200) await must(sb.from("docs").delete().eq("coll", c).in("id", gone.slice(i, i + 200)));
      incoming.forEach(it => rows.push({ coll: c, id: it.id, data: it }));
    }
    for (let i = 0; i < rows.length; i += 500) await must(sb.from("docs").upsert(rows.slice(i, i + 500)));
    await loadAll(); render(true); setSync("Delt · lagret", "ok"); toast("Dataene er importert.");
  } catch (e) { dbErr(e); }
}

  cArea: el => { UI.cArea = el.dataset.a; render(true); },
  quickAdd: () => {
    const opts = [["newTask", "Oppgave", "board"], ["newContact", "Kontakt", "users"], ["newKb", "Kunnskapsnotat", "book"], ["newDecision", "Beslutning", "check"], ["newDoc", "Dokument eller lenke", "link"], ["newExpense", "Utlegg", "coins"]];
    modalEl.innerHTML = `<div class="modal-bg" data-act="modalBg"><div class="modal" style="width:min(380px,100%)" role="dialog" aria-modal="true" aria-label="Legg til"><h3>Legg til</h3>
      <div class="assign-list">${opts.map(([a, l, i]) => `<button class="assign-opt" data-act="qa" data-a="${a}">${ico(i)}<span>${l}</span></button>`).join("")}</div></div></div>`;
  },
  qa: el => { const d = Object.assign({}, el.dataset); closeModal(); A[d.a]({ dataset: d }); },
  areaAdd: el => {
    const id = el.dataset.area;
    const opts = [["newTaskIn", "Oppgave", "board", ""], id === "produkt" ? ["newItem", "Funksjon eller idé", "cpu", 'data-kind="funksjon" data-status="Vurderes"'] : ["newItem", "Sak", "flag", 'data-kind="sak"'],
      ["newContact", "Kontakt", "users", ""], ["newDecision", "Beslutning", "check", ""], ["newDoc", "Dokument eller lenke", "link", ""]];
    modalEl.innerHTML = `<div class="modal-bg" data-act="modalBg"><div class="modal" style="width:min(380px,100%)" role="dialog" aria-modal="true" aria-label="Legg til"><h3>Legg til i ${esc(areaName(id))}</h3>
      <div class="assign-list">${opts.map(([a, l, i, x]) => `<button class="assign-opt" data-act="qa" data-a="${a}" data-area="${id}" ${x}>${ico(i)}<span>${l}</span></button>`).join("")}</div></div></div>`;
  },
  nextStep: el => { const t = clone(S.tasks[el.dataset.id]); if (t) moveTask(t, NEXT_STEP[t.status][0]); },
  assign: el => openPicker(el.dataset.id, null),
  pickToggle: el => {
    const o = el.dataset.o, s = UI.pick.sel;
    const next = s.includes(o) ? s.filter(x => x !== o) : [...s, o];
    UI.pick.sel = PEOPLE.filter(p => next.includes(p)); renderPicker();
  },
  pickSave: () => {
    const { id, to, sel } = UI.pick; const t = clone(S.tasks[id]); if (!t) return closeModal();
    if ((to || needsOwner(t.status)) && !sel.length) return;
    t.owners = sel; closeModal();
    if (to) { setTaskStatus(t, to); if (to === "Pågår") toast(`Godt i gang, ${joinNames(sel)}! Oppgaven ligger nå under «Pågår».`); }
    else { put("tasks", t); toast(sel.length ? `Ansvarlig: ${joinNames(sel)}.` : "Satt til ikke fordelt."); }
  },
  toggleDone: el => { const t = clone(S.tasks[el.dataset.id]); if (!t) return; if (isDone(t)) { setTaskStatus(t, t.prevStatus && t.prevStatus !== "Ferdig" ? normStatus(t.prevStatus) : "Må gjøres"); } else moveTask(t, "Ferdig"); },
  editTask: el => { const t = S.tasks[el.dataset.id]; if (t) taskForm(clone(t), false); },
  editTaskFromWhat: el => { closeModal(); A.editTask(el); },
  startTask: el => { const t = clone(S.tasks[el.dataset.id]); closeModal(); if (t) moveTask(t, "Pågår"); },
  newTask: () => taskForm(newTask({ status: "Må gjøres" }), true),
  go2: el => A.go(el),
  pickFocus: () => {
    const open = tasks().filter(t => !t.focus && !isDone(t)).sort(byPrioDue);
    modalEl.innerHTML = `<div class="modal-bg" data-act="modalBg"><div class="modal"><h3>Velg fokusoppgave</h3><p class="muted" style="margin-top:-8px">${3 - focusTasks().length} plass${3 - focusTasks().length === 1 ? "" : "er"} ledig i ukens fokus.</p>
      <div class="scroll-list" style="max-height:52vh">${open.map(t => `<div class="lrow" data-act="setFocus" data-id="${t.id}"><span class="lt"><b>${ph(t.title)}</b><small>${t.due ? fmtDate(t.due) : "Ingen frist"} · ${esc(t.prio)}</small></span><span class="badge t-${taskTone(t)}">${t.due ? relText(daysUntil(t.due)) : "–"}</span></div>`).join("")}</div>
      <div class="modal-foot"><div class="r"><button class="btn ghost" data-act="closeModal">Lukk</button></div></div></div></div>`;
  },
  setFocus: el => { if (focusTasks().length >= 3) { toast("Ukens fokus har allerede tre oppgaver.", true); return closeModal(); } const t = clone(S.tasks[el.dataset.id]); t.focus = true; put("tasks", t); closeModal(); },
  addCard: el => { UI.addingCol = el.dataset.field + ":" + el.dataset.key; render(true); },
  addCardCancel: () => { UI.addingCol = null; render(true); },
  addCardSave: () => {
    const inp = document.getElementById("add-input"); if (!inp) return;
    const title = inp.value.trim(); const field = inp.dataset.field, key = inp.dataset.key;
    if (!title) { UI.addingCol = null; return render(true); }
    const want = field === "status" ? key : "Må gjøres", own = field === "owner" && key ? [key] : [];
    const t = newTask({ title, status: needsOwner(want) && !own.length ? "Må gjøres" : want, owners: own });
    if (UI.filter !== "all" && !taskFilter(t)) UI.filter = "all";
    inp.blur(); UI.addingCol = null; put("tasks", t); render(true);
    if (t.status !== want) openPicker(t.id, want); else toast("Kortet er lagt til.");
  },
  editMs: el => { const m = S.milestones[el.dataset.id]; if (m) msForm(clone(m), false); },
  newMs: () => msForm({ id: uid("m"), n: Math.max(0, ...arr("milestones").map(m => m.n || 0)) + 1, title: "", subtitle: "", date: null, end: null, dateText: "", type: "Innlevering", status: "Ikke startet", note: "" }, true),
  newLead: el => leadForm({ id: uid("l"), family: "", source: "", price: null, owner: "", next: "", date: null, stage: (el && el.dataset.key) || "Lead", note: "" }, true),
  editLead: el => { const l = S.leads[el.dataset.id]; if (l) leadForm(clone(l), false); },
  editBudget: el => { const b = S.budget[el.dataset.id]; if (b) budgetForm(clone(b), false); },
  newBudget: () => budgetForm({ id: uid("b"), n: Math.max(0, ...arr("budget").map(b => b.n || 0)) + 1, post: "", budget: null, actual: 0, status: "Planlagt", note: "" }, true),
  editSettings: () => {
    const s = clone(S.meta.settings || { id: "settings", totalBudget: 0, totalNote: "" });
    openForm({ title: "Total budsjettramme", value: s, fields: [{ k: "totalBudget", label: "Total ramme (kr)", type: "number" }, { k: "totalNote", label: "Kilde / merknad", full: true, hint: "Fjern [BEKREFT] når beløpet er bekreftet." }],
      onSave: v => { put("meta", Object.assign(s, v, { totalBudget: v.totalBudget || 0 })); closeModal(); } });
  },
  newExpense: () => expenseForm({ id: uid("e"), date: todayISO(), person: UI.me || "", what: "", amount: null, post: "", status: "Ikke refundert", note: "" }, true),
  editExpense: el => { const e = S.expenses[el.dataset.id]; if (e) expenseForm(clone(e), false); },
  refundExpense: el => {
    const e = clone(S.expenses[el.dataset.id]); if (!e || e.status === "Refundert") return;
    e.status = "Refundert"; put("wallet", refundTx(e)); put("expenses", e);
    toast(`${kr(e.amount)} er refundert til ${e.person}. Saldoen er nå ${kr(walletBalance())}.`);
  },
  newTx: el => txForm({ id: uid("w"), date: todayISO(), type: el.dataset.t || "Inn", amount: null, text: "", by: UI.me || "", post: "", expenseId: "", created: new Date().toISOString() }, true),
  editTx: el => { const w = S.wallet[el.dataset.id]; if (w) txForm(clone(w), false); },
  newLegal: () => legalForm({ id: uid("l"), question: "", status: "Uavklart", owner: UI.me || "", findings: "", next: "", files: [], link: "", updated: todayISO() }, true),
  editLegal: el => { const l = S.legal[el.dataset.id]; if (l) legalForm(clone(l), false); },
  newCdoc: () => cdocForm({ id: uid("cd"), title: "", kind: "Kontrakt", status: "Mangler", parties: "", date: null, owner: "", note: "", files: [], link: "" }, true),
  editCdoc: el => { const d = S.companyDocs[el.dataset.id]; if (d) cdocForm(clone(d), false); },
  editCompany: () => companyForm(),
  incRange: el => { UI.incRange = el.dataset.r; render(true); },
  editFund: el => { const f = S.funding[el.dataset.id]; if (f) fundForm(clone(f), false); },
  newFund: () => fundForm({ id: uid("f"), n: Math.max(0, ...arr("funding").map(f => f.n || 0)) + 1, step: 0, name: "", amount: "", deadline: "", status: "Ikke startet", owner: "", req: "" }, true),
  editHyp: el => { const h = S.hypotheses[el.dataset.id]; if (h) hypForm(clone(h), false); },
  newHyp: () => hypForm({ id: uid("h"), n: Math.max(0, ...arr("hypotheses").map(h => h.n || 0)) + 1, title: "", falsifier: "", test: "", result: "", decision: "", evidence: "Antagelse", status: "Ikke testet" }, true),
  editInterview: el => { const i = S.interviews[el.dataset.id]; if (i) interviewForm(clone(i), false); },
  newInterview: () => { const nr = Math.max(0, ...arr("interviews").map(i => i.nr || 0)) + 1; interviewForm({ id: uid("i"), nr, title: "Intervju " + String(nr).padStart(2, "0"), date: todayISO(), segment: "", findings: "", owner: UI.me || "", hyps: [], files: [], link: "" }, true); },
  newMeeting: () => meetingForm({ id: uid("mt"), title: "Teammøte", date: todayISO(), attendees: [...PEOPLE], decisions: "", actions: [] }, true),
  editMeeting: el => { const m = S.meetings[el.dataset.id]; if (m) meetingForm(clone(m), false); },
  actionToTask: el => {
    const m = clone(S.meetings[el.dataset.mid]); const a = m.actions.find(x => x.id === el.dataset.aid); if (!a) return;
    const t = newTask({ title: a.text, status: "Må gjøres", note: `Fra møte ${m.date ? fmtDate(m.date) : ""}`.trim() });
    put("tasks", t); a.taskId = t.id; put("meetings", m); toast("Actionpunktet er lagt til som oppgave i «Må gjøres».");
  },
  saveWin: () => {
    const ta = document.getElementById("win-text"); const text = (ta ? ta.value : "").trim();
    const today = todayISO(), wk = weekKey(today);
    UI.winDraft = null; if (ta) ta.blur();
    if (!text) { if (S.wins[wk]) del("wins", wk); else render(true); return; }
    put("wins", { id: wk, week: isoWeek(today), text, updated: new Date().toISOString() }); render(true); toast("Ukens seier er lagret.");
  },
  whatNow: () => { UI.whatIdx = 0; whatNow(); },
  whatNext: () => { UI.whatIdx++; whatNow(); },
  closeModal: () => closeModal(),
  modalBg: (el, ev) => { if (ev.target === el) closeModal(); },
  saveModal: () => { if (modalCtx) modalCtx.onSave(readForm()); },
  askDelete: () => { document.getElementById("delrow").innerHTML = `<span>Slette for godt?</span><button class="btn danger" data-act="confirmDelete">Ja, slett</button><button class="btn ghost" data-act="cancelDelete">Nei</button>`; },
  cancelDelete: () => { document.getElementById("delrow").innerHTML = `<button class="btn danger" data-act="askDelete">Slett</button>`; },
  confirmDelete: () => { if (modalCtx && modalCtx.onDelete) modalCtx.onDelete(); },
  exportData, importData, checkImport, doImport,
  logout: () => { sb.auth.signOut().finally(() => location.reload()); },
  openFile: async el => {
    // Åpne fanen med en gang (ellers stopper nettleseren den), og send den til en lenke som varer i fem minutter
    const w = window.open("", "_blank"); if (w) w.opener = null;
    const { data, error } = await sb.storage.from(BUCKET).createSignedUrl(el.dataset.path, 300);
    if (error || !data) { if (w) w.close(); return toast("Fant ikke filen. Den kan være slettet.", true); }
    if (w) w.location.href = data.signedUrl; else location.href = data.signedUrl;
  },
  copyExport: () => { const ta = document.getElementById("io-text"); const txt = ta.value; try { navigator.clipboard.writeText(txt).then(() => toast("Kopiert."), () => { ta.select(); toast("Marker teksten og kopier med Cmd/Ctrl + C."); }); } catch (e) { ta.select(); } }
};
document.addEventListener("click", ev => {
  if (ev.target.closest("a.linkout:not(.filelink)")) return;
  const el = ev.target.closest("[data-act]"); if (!el) return;
  const fn = A[el.dataset.act]; if (!fn) return;
  if (el.tagName === "BUTTON" || el.tagName === "A") ev.preventDefault();
  if (el.dataset.act !== "modalBg") ev.stopPropagation();
  fn(el, ev);
});
document.addEventListener("keydown", ev => {
  if (ev.key === "Escape") { if (modalEl.innerHTML) closeModal(); else if (UI.addingCol) { UI.addingCol = null; render(true); } }
  if (ev.target.id === "add-input" && ev.key === "Enter" && !ev.shiftKey) { ev.preventDefault(); A.addCardSave(); }
  if (ev.key === "Enter" && ev.target.matches && ev.target.matches(".kc,.lrow,.msrow,.stair,.hyp")) ev.target.click();
  if (ev.key === "Enter" && modalCtx && ev.target.tagName === "INPUT" && ev.target.type !== "checkbox") { ev.preventDefault(); A.saveModal(); }
});
main.addEventListener("change", ev => { if (ev.target.id === "area-filter") { UI.areaFilter = ev.target.value; ev.target.blur(); render(true); return; } if (ev.target.id === "me-select") { UI.me = ev.target.value; savePref(); ev.target.blur(); render(true); } });
main.addEventListener("input", ev => {
  if (ev.target.id === "win-text") UI.winDraft = ev.target.value;
  if (ev.target.id === "kb-search") { UI.kbQ = ev.target.value; applySearch(UI.kbQ); }
  if (ev.target.id === "contact-search") { UI.cQ = ev.target.value; applySearch(UI.cQ); }
});
main.addEventListener("submit", ev => ev.preventDefault());
main.addEventListener("mousemove", incomeHover);
main.addEventListener("mouseout", ev => { if (ev.target.classList && ev.target.classList.contains("inc-hit")) incomeLeave(ev); });

/* Dra og slipp */
let dragInfo = null;
main.addEventListener("dragstart", ev => {
  const c = ev.target.closest && ev.target.closest("[data-drag]"); if (!c) return;
  dragInfo = { kind: c.dataset.drag, id: c.dataset.id, from: c.dataset.from || "" }; c.classList.add("dragging");
  try { ev.dataTransfer.setData("text/plain", c.dataset.id); ev.dataTransfer.effectAllowed = "move"; } catch (e) {}
});
main.addEventListener("dragend", ev => { const c = ev.target.closest && ev.target.closest("[data-drag]"); if (c) c.classList.remove("dragging"); main.querySelectorAll(".col.over").forEach(x => x.classList.remove("over")); dragInfo = null; });
main.addEventListener("dragover", ev => {
  const col = ev.target.closest("[data-drop]"); if (!col || !dragInfo || col.dataset.drop !== dragInfo.kind) return;
  ev.preventDefault(); main.querySelectorAll(".col.over").forEach(x => x !== col && x.classList.remove("over")); col.classList.add("over");
});
main.addEventListener("dragleave", ev => { const col = ev.target.closest("[data-drop]"); if (col && !col.contains(ev.relatedTarget)) col.classList.remove("over"); });
main.addEventListener("drop", ev => {
  const col = ev.target.closest("[data-drop]"); if (!col || !dragInfo || col.dataset.drop !== dragInfo.kind) return;
  ev.preventDefault(); col.classList.remove("over");
  const field = col.dataset.field, key = col.dataset.key;
  if (dragInfo.kind === "task") {
    const t = clone(S.tasks[dragInfo.id]); if (!t) return;
    if (field === "status") moveTask(t, key);
    else {
      const from = dragInfo.from, cur = ownersOf(t); if (from === key) return;
      const next = cur.filter(o => o !== from); if (key && !next.includes(key)) next.push(key);
      t.owners = PEOPLE.filter(p => next.includes(p));
      if (!t.owners.length && needsOwner(t.status)) { t.status = "Må gjøres"; put("tasks", t); toast("Ingen ansvarlig igjen, så oppgaven er flyttet tilbake til «Må gjøres»."); }
      else { put("tasks", t); toast(key ? (from ? `Flyttet fra ${from} til ${key}.` : `Fordelt til ${key}.`) : `${from} er fjernet fra oppgaven.`); }
    }
  } else if (dragInfo.kind === "item") {
    const i = clone(S.items[dragInfo.id]); if (!i || (i.status || "") === key) return;
    i.status = key; put("items", i); toast(key ? `«${i.title}» er flyttet til ${key.toLowerCase()}.` : "Status er fjernet.");
  } else {
    const l = clone(S.leads[dragInfo.id]); if (!l || l.stage === key) return;
    l.stage = key; put("leads", l);
    if (key === "Betalende") toast(`${paying().length} av ${PILOT_GOAL} pilotfamilier betaler. Godt jobbet!`);
  }
  dragInfo = null;
});

/* Ruting */
function route() {
  let h = (location.hash || "").replace("#", "");
  if (ALIAS[h]) h = ALIAS[h];
  const [pg, sub] = h.split(".");
  UI.page = PAGES.some(p => p.id === pg) ? pg : "hjem"; UI.sub = sub || "oversikt";
  UI.addingCol = null; render(true); window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);

/* Ny dag: regn om nedtellingen ved midnatt */
let lastDay = todayISO();
setInterval(() => { const d = todayISO(); if (d !== lastDay) { lastDay = d; render(); } }, 60000);

boot();
</script>
</body>
