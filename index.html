<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Arvklart Kontrollsenter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
/* Layout: brun flate, venstre sidekolonne (rosa nedtellingskort + meny), kremhvite kort i rutenett til høyre. Ett bevisst tema, likt Kontrollsenter. */
:root{
  color-scheme: light;
  --bg:#6E5847; --bg-deep:#5E4A3B;
  --card:#F0E8DC; --card-hi:#F7F2EA; --line:#E2D5C2; --track:#E2D6C4;
  --ink:#3B2F27; --muted:#8A7867; --on-bg:#F0E8DC; --on-bg-muted:#D6C6B3;
  --rose:#D97C7C; --rose-soft:#F2D6D2; --mustard:#EADFC4; --bar:#3A2E26;
  --red:#C2544B; --red-soft:#F4D5D0; --red-ink:#8E352D;
  --orange:#D98A38; --orange-soft:#F5E0C3; --orange-ink:#86501A;
  --green:#6F9A5F; --green-soft:#DDE8D3; --green-ink:#41653A;
  --ph:#B8913A; --inc:#9A7B5E; --ph-soft:#F3E7C7;
  --av-a:#D97C7C; --av-b:#6F8FA6; --av-j:#7E9F72; --av-o:#C29A45;
  --serif:"Fraunces","DM Serif Display",Georgia,serif;
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:22px; --r-sm:14px;
  --shadow:0 1px 2px rgba(45,30,18,.10),0 10px 28px rgba(45,30,18,.16);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink)}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
img{max-width:100%}
body{margin:0;font-family:var(--sans);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--rose);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.app{display:grid;grid-template-columns:272px minmax(0,1fr);gap:24px;max-width:1480px;margin:0 auto;padding-inline:24px;padding-block:24px 110px}

/* ---------- Sidekolonne ---------- */
.side{display:flex;flex-direction:column;gap:18px;position:sticky;top:calc(24px + env(safe-area-inset-top,0px));align-self:start}
.widget{border-radius:var(--r);padding:20px;background:linear-gradient(155deg,#EDB1A9 0%,#DE8C86 55%,#CF7474 100%);box-shadow:var(--shadow);color:#3A2420}
.widget .eyebrow{color:#5B302B;opacity:.85}
.flips{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.flip{display:flex;flex-direction:column;align-items:center;gap:6px}
.tile{position:relative;width:100%;height:88px;border-radius:12px;background:linear-gradient(180deg,#45372E 0%,#3A2E26 50%,#30261F 50%,#2B221C 100%);display:grid;place-items:center;box-shadow:inset 0 -2px 0 rgba(0,0,0,.25),0 6px 14px rgba(58,30,25,.35);perspective:400px;overflow:hidden}
.tile::after{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:rgba(0,0,0,.45);box-shadow:0 1px 0 rgba(255,255,255,.06)}
.tile span{font-family:var(--mono);font-weight:700;font-size:46px;color:#FFFFFF;letter-spacing:-.02em;line-height:1}
.tile.small span{font-size:34px}
.tile.flipping span{animation:flip .5s ease-out}
@keyframes flip{0%{transform:rotateX(80deg);opacity:.2}100%{transform:rotateX(0);opacity:1}}
.flip label{font-size:10.5px;letter-spacing:.16em;font-weight:700;color:#4A2622;text-transform:uppercase}
.widget-name{font-family:var(--serif);font-size:22px;font-weight:600;margin-top:14px;line-height:1.15;text-wrap:balance}
.widget-sub{font-size:12.5px;color:#4E2C27;margin-top:4px}
.widget-today{display:flex;justify-content:space-between;gap:8px;margin-top:12px;padding-top:10px;border-top:1px solid rgba(70,30,25,.18);font-size:12px;color:#4E2C27}
.nav{display:flex;flex-direction:column;gap:4px}
.nav a{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:var(--r-sm);color:var(--on-bg);text-decoration:none;font-weight:500;opacity:.86;transition:background .15s,opacity .15s}
.nav a:hover{background:rgba(240,232,220,.10);opacity:1}
.nav a.on{background:var(--card);color:var(--ink);opacity:1;box-shadow:var(--shadow)}
.nav svg{width:17px;height:17px;flex:none}
.nav .count{margin-left:auto;font-family:var(--mono);font-size:11.5px;opacity:.7}
.side-foot{display:flex;flex-direction:column;gap:8px;padding:12px 14px;border-radius:var(--r-sm);background:rgba(0,0,0,.10);color:var(--on-bg-muted);font-size:12px}
.side-foot .row{display:flex;gap:6px;flex-wrap:wrap}
.linkbtn{background:none;border:1px solid rgba(240,232,220,.28);color:var(--on-bg);border-radius:999px;padding:4px 10px;font-size:12px}
.linkbtn:hover{background:rgba(240,232,220,.12)}
.sync{display:flex;align-items:center;gap:6px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--on-bg-muted);display:inline-block}
.sync.ok i{background:#9CC68B}.sync.warn i{background:#E9B26A}

/* ---------- Hovedflate ---------- */
.main{min-width:0;display:flex;flex-direction:column;gap:20px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;color:var(--on-bg)}
.head h1.brand{display:flex;align-items:center;gap:12px;font-family:var(--sans);font-weight:800;letter-spacing:.06em;font-size:30px;color:#FFFFFF}
/* Logoen er en maske, så den får samme farge som teksten rundt (hvit på brunt, mørk i valgt menypunkt) */

.head h1.brand .logo-mark{width:58px;height:46px}
.nav a[href="#hjem"]{font-weight:700;letter-spacing:.04em;text-transform:uppercase;font-size:13px}
.nav a[href="#hjem"] .logo-mark{width:24px;height:19px}
.head h1{font-family:var(--serif);font-weight:600;font-size:32px;line-height:1.1;margin:2px 0 0;text-wrap:balance}
.head p{margin:4px 0 0;color:var(--on-bg-muted);max-width:62ch}
.head .eyebrow{color:var(--on-bg-muted)}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:22px;min-width:0}
.card h2{font-family:var(--serif);font-weight:600;font-size:20px;line-height:1.2;margin:0;text-wrap:balance}
.card .sub{color:var(--muted);font-size:13px;margin:3px 0 0}
.card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:14px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.grid-top{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.35fr);gap:20px}
.grid-top .scroll-list{max-height:262px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.scroll-list{max-height:248px;overflow:auto;display:flex;flex-direction:column;gap:8px;padding-right:2px;margin-right:-4px}
.empty{padding:18px;border:1px dashed var(--line);border-radius:var(--r-sm);color:var(--muted);text-align:center;font-size:13px;background:var(--card-hi)}
.ph{display:inline-block;padding:0 6px;border-radius:6px;background:var(--ph-soft);color:#7A5A16;border:1px dashed var(--ph);font-family:var(--mono);font-size:.86em;font-weight:500;white-space:normal}

/* Fokus-liste (Dagens 3-stil) */
.focus-item{display:flex;align-items:flex-start;gap:12px;padding:12px 14px;background:var(--card-hi);border:1px solid var(--line);border-left:3px solid var(--rose);border-radius:12px}
.focus-item.done{border-left-color:var(--green)}
.focus-item.done .ft{text-decoration:line-through;color:var(--muted)}
.ring{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid #B9A691;background:transparent;display:grid;place-items:center;padding:0;margin-top:1px;transition:all .2s}
.ring:hover{border-color:var(--ink)}
.ring svg{width:12px;height:12px;opacity:0;color:#fff}
.ring.on{background:var(--green);border-color:var(--green)}
.ring.on svg{opacity:1}
.ft{font-weight:600;line-height:1.3;cursor:pointer}
.fm{display:flex;gap:6px 10px;flex-wrap:wrap;margin-top:4px;font-size:12.5px;color:var(--muted);align-items:center}
.add-focus{border:1px dashed #C9B8A2;background:none;border-radius:12px;padding:10px;color:var(--muted);font-weight:500}
.add-focus:hover{background:var(--card-hi);color:var(--ink)}

/* Rader i lister */
.lrow{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:12px;background:var(--card-hi);border:1px solid var(--line);cursor:pointer}
.lrow:hover{border-color:#CDBBA4}
.lrow.ms{background:var(--mustard);border-color:#DCCDA9}
.lrow .lt{flex:1;min-width:0}
.lrow .lt b{display:block;font-weight:600;font-size:13.5px;line-height:1.3;overflow-wrap:anywhere}
.lrow .lt small{color:var(--muted);font-size:12px}
.lrow .ld{font-family:var(--mono);font-size:11.5px;color:var(--muted);width:62px;flex:none;line-height:1.25}
.badge{flex:none;font-family:var(--mono);font-size:11.5px;font-weight:500;padding:3px 8px;border-radius:999px;white-space:nowrap}
.t-red{background:var(--red-soft);color:var(--red-ink)}
.t-orange{background:var(--orange-soft);color:var(--orange-ink)}
.t-green{background:var(--green-soft);color:var(--green-ink)}
.t-none{background:#E7DCCC;color:var(--muted)}
.weeknav{display:flex;align-items:center;gap:4px}
.iconbtn{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--card-hi);display:grid;place-items:center;padding:0}
.iconbtn:hover{background:#fff}
.iconbtn svg{width:14px;height:14px}
.weeklabel{font-family:var(--mono);font-size:12px;color:var(--muted);text-align:center;margin:-6px 0 10px}

/* Stort kort */
.big{display:grid;grid-template-columns:1.25fr 1.25fr .8fr 1fr;gap:0}
.big > section{padding:2px 22px;border-left:1px solid var(--line);min-width:0}
.big > section:first-child{padding-left:0;border-left:0}
.big > section:last-child{padding-right:0}
.big .eyebrow{display:block;margin-bottom:12px}
.metric{margin-bottom:12px}
.metric:last-child{margin-bottom:0}
.metric .mh{display:flex;justify-content:space-between;gap:8px;font-size:13px;margin-bottom:5px}
.metric .mh span:first-child{min-width:0}
.metric .mv{font-family:var(--mono);font-size:12.5px;white-space:nowrap}
.bar{height:6px;border-radius:3px;background:var(--track);overflow:hidden}
.bar > i{display:block;height:100%;background:var(--bar);border-radius:3px;transition:width .5s ease}
.bar.green > i{background:var(--green)}
.ringwrap{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.ringwrap svg{width:118px;height:118px}
.ringwrap .rn{font-weight:600;font-size:13.5px}
.team{display:flex;flex-direction:column;gap:9px}
.trow{display:flex;align-items:center;gap:10px;font-size:13.5px}
.trow .tn{flex:1}
.trow .tc{font-family:var(--mono);font-weight:500}
.av{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:12px;background:var(--muted)}
.av.sm{width:22px;height:22px;font-size:10.5px}
.av.none{background:transparent;border:1.5px dashed #A8957F;color:var(--muted)}
.av.A{background:var(--av-a)}.av.B{background:var(--av-b)}.av.J{background:var(--av-j)}.av.Ø{background:var(--av-o)}

/* Chips */
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:7px;padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-weight:500;font-size:13px;box-shadow:0 1px 2px rgba(45,30,18,.12)}
.chip:hover{background:#fff}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.chip .dot.red{background:var(--red)}.chip .dot.orange{background:var(--orange)}.chip .dot.green{background:var(--green)}
.chip svg{width:14px;height:14px}
.chip.on{background:var(--bar);color:var(--card);border-color:var(--bar)}
.chip b{font-family:var(--mono);font-weight:700}

/* Varsler */
.alerts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.alert{padding:11px 14px;border-radius:12px;background:var(--card-hi);border:1px solid var(--line);border-left:3px solid var(--rose);font-size:13.5px;line-height:1.4;cursor:default}
.alert[data-act]{cursor:pointer}
.alert[data-act]:hover{border-color:#CDBBA4}
.alert.red{border-left-color:var(--red)}
.alert.orange{border-left-color:var(--orange)}
.alert.ph-tone{border-left-color:var(--ph)}
.alert small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.alert .ak{font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:2px}

/* Ukens seier */
.win textarea{width:100%;min-height:74px;resize:vertical;border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--card-hi);line-height:1.45}
.win-actions{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}
.hist{display:flex;flex-direction:column;gap:6px;margin-top:14px}
.hist div{display:flex;gap:12px;font-size:13px;padding:8px 12px;border-radius:10px;background:var(--mustard)}
.hist .mono{color:var(--muted);flex:none;font-size:12px;padding-top:1px}

/* Knapper */
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--bar);background:var(--bar);color:var(--card);border-radius:999px;padding:8px 16px;font-weight:600;font-size:13px}
.btn:hover{background:#2A2019}
.btn.ghost{background:transparent;color:var(--ink);border-color:#CDBBA4}
.btn.ghost:hover{background:var(--card-hi)}
.btn.danger{background:transparent;color:var(--red-ink);border-color:#E3B5AE}
.btn.light{background:var(--card);color:var(--ink);border-color:var(--card)}
.btn.light:hover{background:#fff}
.btn svg{width:14px;height:14px}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(22px + env(safe-area-inset-bottom,0px));z-index:30;display:inline-flex;align-items:center;gap:9px;background:var(--bar);color:var(--card);border:0;border-radius:999px;padding:13px 22px;font-weight:600;font-size:14px;box-shadow:0 10px 30px rgba(30,18,10,.45)}
.fab:hover{background:#2A2019}
.fab svg{width:16px;height:16px}

/* Kanban */
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.seg{display:inline-flex;background:rgba(0,0,0,.14);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;color:var(--on-bg);padding:6px 14px;border-radius:999px;font-weight:500;font-size:13px}
.seg button.on{background:var(--card);color:var(--ink)}
.board-scroll{overflow-x:auto;padding-bottom:6px;margin-inline:-4px;padding-inline:4px}
.board{display:grid;grid-template-columns:repeat(var(--cols,5),minmax(232px,1fr));gap:14px;align-items:start}
.col{background:#E6DACA;border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:9px;min-height:120px;border:1px solid #D9CAB5;transition:background .15s,box-shadow .15s}
.col.over{background:#F0E5D4;box-shadow:inset 0 0 0 2px var(--rose)}
.col-head{display:flex;align-items:center;justify-content:space-between;padding:2px 4px 4px}
.col-head b{font-weight:700;font-size:13px}
.col-head .mono{font-size:12px;color:var(--muted);background:var(--card-hi);border-radius:999px;padding:1px 8px}
.kc{position:relative;background:#FBF7F1;border:1px solid var(--line);border-radius:12px;padding:12px 12px 10px;box-shadow:0 1px 2px rgba(45,30,18,.10);cursor:grab;overflow:hidden;display:flex;flex-direction:column;gap:8px}
.kc:hover{box-shadow:0 4px 12px rgba(45,30,18,.14)}
.kc.dragging{opacity:.45}
.kc::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:var(--stripe,#C9B8A2)}
.kc.p-Kritisk{--stripe:var(--red)}.kc.p-Høy{--stripe:var(--orange)}.kc.p-Middels{--stripe:#C9AE6B}.kc.p-Lav{--stripe:#A9B89D}
.kc .kt{font-weight:600;font-size:13.5px;line-height:1.32;overflow-wrap:anywhere;margin-top:2px}
.kc.isdone .kt{color:var(--muted);text-decoration:line-through}
.kc .kf{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.kc .kf .av{margin-left:auto}
.tag{font-size:11px;font-weight:600;color:var(--muted);background:#EFE6D9;border:1px solid var(--line);border-radius:6px;padding:1px 7px}
.kc.pop{animation:pop .7s ease}
.kc .stamp{position:absolute;right:10px;top:10px;width:22px;height:22px;border-radius:50%;background:var(--green);display:grid;place-items:center;color:#fff}
.kc .stamp svg{width:12px;height:12px}
.kc.pop .stamp{animation:stamp .6s ease}
@keyframes pop{0%{transform:scale(1)}30%{transform:scale(1.035);box-shadow:0 0 0 4px rgba(111,154,95,.35)}100%{transform:scale(1)}}
@keyframes stamp{0%{transform:scale(0)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
.kmove{display:flex;justify-content:flex-end;margin-top:-2px}
.kmove .mini{display:inline-flex;align-items:center;gap:4px}
.kmove .mini svg{width:11px;height:11px}
.kmove .mini.ghosty{background:transparent;border-color:transparent;color:var(--muted);font-weight:500}
.avbtn{margin-left:auto;border:0;background:none;padding:0;border-radius:50%;line-height:0;cursor:pointer}
.avbtn:hover .av{box-shadow:0 0 0 2px var(--card),0 0 0 4px #CDBBA4}
.kc .kf .avbtn .av{margin-left:0}
.assign-list{display:flex;flex-direction:column;gap:6px}
.assign-opt{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card-hi);font-weight:600;text-align:left}
.assign-opt:hover{background:#fff}
.assign-opt.on{border-color:var(--bar);box-shadow:inset 0 0 0 1px var(--bar);background:#fff}
.assign-opt .tick{margin-left:auto;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;border:1.5px solid #CDBBA4;color:#fff}
.assign-opt.on .tick{background:var(--green);border-color:var(--green)}
.assign-opt .tick svg{width:12px;height:12px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.avs{display:inline-flex;align-items:center}
.avs .av + .av{margin-left:-7px;box-shadow:0 0 0 2px #FBF7F1}
.kown{font-size:12px;color:var(--muted);margin-top:-2px}
.addcard{border:0;background:transparent;color:var(--muted);text-align:left;padding:7px 8px;border-radius:10px;font-weight:500;font-size:13px}
.addcard:hover{background:rgba(255,255,255,.5);color:var(--ink)}
.addbox textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 10px;background:#fff;resize:none;min-height:58px}
.addbox .row{display:flex;gap:6px;margin-top:6px}
.filterbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filterbar select{border-radius:999px;border:1px solid var(--line);background:var(--card);padding:6px 10px;font-size:13px}

/* Milepæler */
.tl-scroll{overflow-x:auto}
.tl{position:relative;min-width:760px;padding-top:30px}
.tl-axis{position:absolute;left:0;right:0;top:0;height:24px}
.tl-axis span{position:absolute;top:0;transform:translateX(-50%);font-family:var(--mono);font-size:11px;color:var(--muted)}
.tl-grid{position:absolute;top:22px;bottom:0;width:1px;background:var(--line)}
.tl-row{position:relative;height:34px}
.tl-row:nth-child(odd){background:rgba(234,223,196,.35)}
.tl-mark{position:absolute;top:50%;transform:translate(-50%,-50%);width:14px;height:14px;border-radius:50%;border:2px solid var(--card);box-shadow:0 0 0 1.5px var(--bar);background:var(--bar)}
.tl-range{position:absolute;top:50%;transform:translateY(-50%);height:12px;border-radius:6px;background:var(--rose);opacity:.85}
.tl-label{position:absolute;top:50%;transform:translateY(-50%);font-size:12.5px;font-weight:600;white-space:nowrap}
.tl-label small{font-family:var(--mono);font-weight:400;color:var(--muted);margin-left:6px}
.tl-today{position:absolute;top:18px;bottom:0;width:2px;background:var(--rose);z-index:2}
.tl-today span{position:absolute;top:-16px;left:50%;transform:translateX(-50%);font-family:var(--mono);font-size:10.5px;font-weight:700;color:#fff;background:var(--rose);border-radius:999px;padding:0 7px;white-space:nowrap}
.mslist{display:flex;flex-direction:column;gap:10px}
.msrow{display:grid;grid-template-columns:86px minmax(0,1fr) 200px;gap:18px;align-items:center;padding:14px 16px;border-radius:16px;background:var(--card-hi);border:1px solid var(--line);cursor:pointer}
.msrow.next{border-left:3px solid var(--rose);background:var(--mustard)}
.msrow:hover{border-color:#CDBBA4}
.msdate{font-family:var(--mono);line-height:1.25}
.msdate b{display:block;font-size:15px}
.msdate small{color:var(--muted);font-size:11.5px}
.msmeta{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;align-items:center}
.pill{font-size:11.5px;font-weight:600;border-radius:999px;padding:2px 9px;border:1px solid var(--line);background:var(--card)}
.pill.s-Levert,.pill.s-Ferdig,.pill.s-Betalt,.pill.s-Innvilget{background:var(--green-soft);color:var(--green-ink);border-color:transparent}
.pill.s-Pågår,.pill.s-Testes,.pill.s-Undersøkes,.pill.s-Bestilt,.pill.s-Søkt{background:var(--orange-soft);color:var(--orange-ink);border-color:transparent}
.pill.s-Obligatorisk{background:var(--red-soft);color:var(--red-ink);border-color:transparent}
.msprog{display:flex;flex-direction:column;gap:6px}
.msprog .mh{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}

/* Salg */
.hero-sales{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:24px;align-items:center}
.bignum{font-family:var(--serif);font-size:44px;font-weight:600;line-height:1}
.bignum small{font-family:var(--mono);font-size:18px;color:var(--muted);font-weight:500}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{padding:14px;border-radius:14px;background:var(--card-hi);border:1px solid var(--line)}
.kpi .v{font-family:var(--mono);font-size:22px;font-weight:700;margin-top:4px}
.kpi .eyebrow{font-size:10px}

/* Tabeller */
.tablewrap{overflow-x:auto;border-radius:14px;border:1px solid var(--line);background:var(--card-hi)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);font-weight:700;white-space:nowrap;background:var(--card)}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr{cursor:pointer}
tbody tr:hover td{background:#FBF7F1}
tfoot td{font-weight:700;background:var(--mustard);border-bottom:0}
td.num,th.num{text-align:right;font-family:var(--mono);white-space:nowrap}

/* Områder */
.nav-label{display:block;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--on-bg-muted);padding:12px 14px 2px;font-weight:700}
.ldot{width:7px;height:7px;border-radius:50%;background:transparent;border:1.5px solid var(--on-bg-muted);flex:none;margin-left:auto}
.nav a .ldot + .count{margin-left:8px}
.ldot.l-ok{background:var(--green);border-color:var(--green)}.ldot.l-watch{background:var(--orange);border-color:var(--orange)}.ldot.l-help{background:var(--red);border-color:var(--red)}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{border:0;background:rgba(0,0,0,.14);color:var(--on-bg);padding:7px 15px;border-radius:999px;font-weight:500;font-size:13px}
.tab.on{background:var(--card);color:var(--ink)}
.row-label{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:-8px}
.row-label .eyebrow{color:var(--on-bg-muted)}
.row-link{color:var(--on-bg);font-size:13px;text-underline-offset:3px}
.areas-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.acard{cursor:pointer;padding:18px 20px;display:flex;flex-direction:column;gap:10px;border-left:3px solid #CDBBA4}
.acard:hover{border-color:#CDBBA4}
.acard.l-ok,.area-status.l-ok{border-left-color:var(--green)}.acard.l-watch,.area-status.l-watch{border-left-color:var(--orange)}.acard.l-help,.area-status.l-help{border-left-color:var(--red)}
.acard-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.acard h3{font-family:var(--serif);font-weight:600;font-size:17px;margin:0;display:flex;gap:8px;align-items:center;line-height:1.2}
.acard h3 svg{width:16px;height:16px;flex:none;color:var(--muted)}
.acard p{margin:0;font-size:13.5px}
.clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.acard-next{display:flex;gap:8px;align-items:baseline;font-size:12.5px;border-top:1px solid var(--line);padding-top:8px;margin-top:auto}
.acard-next span:last-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acard .facts{margin-top:0}
.light{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap;flex:none}
.light i{width:7px;height:7px;border-radius:50%;background:currentColor}
.area-status{border-left:3px solid #CDBBA4}
.status-text{font-size:16px;line-height:1.5;margin:0;max-width:75ch}
.facts{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.fact{background:var(--card-hi);border:1px solid var(--line);border-radius:8px;padding:4px 9px;font-size:12px;color:var(--muted)}
.fact b{font-family:var(--mono);color:var(--ink);font-weight:700}
.fact.f-red{background:var(--red-soft);border-color:transparent}.fact.f-orange{background:var(--orange-soft);border-color:transparent}.fact.f-ph{background:var(--ph-soft);border:1px dashed var(--ph)}
.area-grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:20px;align-items:start}
.stack{display:flex;flex-direction:column;gap:20px;min-width:0}
.mini-list{display:flex;flex-direction:column;gap:8px}
.card-foot{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.drow{display:grid;grid-template-columns:62px minmax(0,1fr);gap:10px;padding:9px 12px;border-radius:12px;background:var(--card-hi);border:1px solid var(--line);cursor:pointer;font-size:13.5px}
.drow small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.drow .mono{font-size:11.5px;padding-top:2px}
.docrow{display:flex;gap:10px;align-items:center;padding:9px 12px;border-radius:12px;background:var(--card-hi);border:1px solid var(--line)}
.docrow > svg{width:16px;height:16px;color:var(--muted);flex:none}
.docrow .lt{flex:1;min-width:0}.docrow small{display:block;color:var(--muted);font-size:12px}
.linkout{color:var(--ink);font-weight:600;text-decoration:underline;text-decoration-color:var(--rose);text-underline-offset:3px;overflow-wrap:anywhere}
.feat-sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px}
.fs{background:var(--card-hi);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--muted)}
.fs b{font-size:20px;color:var(--ink)}
.col-help{margin:-6px 4px 2px;font-size:12px;color:var(--muted)}
.pdot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;vertical-align:1px}
.atag{background:var(--mustard);border-color:#DCCDA9;color:#6A5530}
.search{border:1px solid var(--line);border-radius:999px;padding:7px 14px;background:var(--card);font-size:13px;width:280px;max-width:100%}
.kb-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.kb{display:flex;flex-direction:column;gap:10px;cursor:pointer}
.kb:hover{border-color:#CDBBA4}
.kb h2{font-size:18px}
.kb-top{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.kb-sum{margin:0;font-size:13.5px}
.learned{background:var(--mustard);border-radius:12px;padding:10px 12px;font-size:13.5px;display:flex;flex-direction:column;gap:3px}
.kb-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:auto;padding-top:4px}
.kb-tags{display:flex;gap:6px;flex-wrap:wrap}
.hash{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.c-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.ccard{display:flex;flex-direction:column;gap:10px}
.cc-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.ccard h2{font-size:18px;overflow-wrap:anywhere}
.cc-line{margin:0;font-size:13.5px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.cc-line .muted{font-size:11px;text-transform:uppercase;letter-spacing:.1em;font-weight:700;min-width:84px}
.cc-info{display:flex;flex-direction:column;gap:2px;font-size:12.5px;padding:8px 10px;border-radius:10px;background:var(--card-hi);border:1px solid var(--line)}
.selectable{user-select:all;overflow-wrap:anywhere}
.ccard .card-foot{margin-top:auto}

.pd{width:34px;height:34px;border-radius:50%;border:2px dashed #C9B8A2;display:grid;place-items:center;font-family:var(--mono);font-size:12px;color:var(--muted)}

.stack-bar{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--track)}

.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:9px;height:9px;border-radius:3px;display:inline-block}

.team-svg{width:100%;max-width:240px;height:auto}
.gt.wide .mini-list{gap:6px}
.mtl{position:relative;height:34px;margin:4px 0 2px}
.mtl-line{position:absolute;left:6%;right:6%;top:16px;height:2px;background:var(--line)}

.mtl-dot{position:absolute;top:6px;transform:translateX(-50%);width:22px;height:22px;border-radius:50%;background:var(--bar);color:var(--card);font-family:var(--mono);font-size:11px;font-weight:700;display:grid;place-items:center;border:2px solid var(--card-hi)}
.mrow{display:flex;align-items:center;gap:10px;font-size:13px;cursor:pointer;padding:3px 0}
.mnum{flex:none;min-width:22px;height:22px;padding:0 4px;border-radius:999px;background:var(--mustard);font-family:var(--mono);font-size:11px;font-weight:700;display:grid;place-items:center}
.mt{flex:1;min-width:0;font-weight:600;line-height:1.3}

.mbar{width:70px;flex:none}
.mtype{font-size:11.5px;flex:none}
.srows{display:flex;flex-direction:column}
.srow{display:grid;grid-template-columns:200px 112px minmax(0,1fr) minmax(0,.8fr);gap:14px;align-items:center;padding:11px 6px;border-top:1px solid var(--line);cursor:pointer;font-size:13.5px}

.stext,.snext{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.snext{font-size:12.5px}
.ok-line{display:flex;gap:8px;align-items:center;margin:0;color:var(--green-ink);font-weight:600}

/* Områdesider */
.as-row{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.as-top{display:flex;gap:10px;align-items:center;margin-bottom:8px}

.extras{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:20px}

.seg-range{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px;align-self:center}

/* Jus og selskap */
.files{display:flex;flex-direction:column;gap:3px;font-size:12.5px}

/* Lommebok */

.wallet-card{border-left:3px solid var(--rose)}

.wallet-lines{display:flex;flex-direction:column;gap:6px;margin:14px 0 16px;padding:12px 14px;border-radius:12px;background:var(--mustard)}

/* Finansieringsstige */
.stairs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;align-items:end}
.stair{border-radius:16px;background:var(--card-hi);border:1px solid var(--line);padding:14px;display:flex;flex-direction:column;gap:6px;cursor:pointer;border-top:4px solid var(--bar)}
.stair:hover{border-color:#CDBBA4;border-top-color:var(--bar)}
.stair .eyebrow{font-size:10px}
.stair b{font-family:var(--serif);font-size:16px;font-weight:600;line-height:1.2}
.stair .amt{font-family:var(--mono);font-size:13px}
.stair dl{margin:4px 0 0;display:grid;grid-template-columns:auto 1fr;gap:3px 8px;font-size:12px}
.stair dt{color:var(--muted)}
.stair dd{margin:0;min-width:0;overflow-wrap:anywhere}

/* Hypoteser */
.method{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:12px}
.method div{padding:12px 14px;border-radius:12px;background:var(--card-hi);border:1px solid var(--line);font-size:13px}
.method div b{display:block;font-family:var(--mono);font-size:11px;color:var(--rose);margin-bottom:3px}
.hyp{display:flex;flex-direction:column;gap:12px;cursor:pointer;border-left:3px solid var(--rose)}
.hyp:hover{border-color:#CDBBA4;border-left-color:var(--rose)}
.hyp dl{margin:0;display:grid;gap:8px}
.hyp dt{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.hyp dd{margin:2px 0 0;font-size:13.5px}
.evi{display:inline-flex;gap:4px;align-items:center}
.evi i{width:22px;height:7px;border-radius:4px;background:var(--track)}
.evi i.on{background:var(--bar)}
.evi span{font-size:12px;color:var(--muted);margin-left:6px}

/* Møter */
.meeting{display:flex;flex-direction:column;gap:12px}
.meeting ul{margin:0;padding-left:18px}
.actions{display:flex;flex-direction:column;gap:6px}
.action{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:10px;background:var(--card-hi);border:1px solid var(--line);font-size:13.5px}
.action span{flex:1;min-width:0}
.mini{font-size:12px;padding:4px 10px;border-radius:999px;border:1px solid #CDBBA4;background:var(--card);font-weight:600}
.mini:hover{background:#fff}
.mini.done{border-color:transparent;background:var(--green-soft);color:var(--green-ink);cursor:default}

/* Modal og toast */
.modal-bg{position:fixed;inset:0;background:rgba(35,24,17,.55);z-index:50;display:grid;place-items:center;padding:16px}
.modal{width:min(620px,100%);max-height:calc(100dvh - 32px);overflow:auto;background:var(--card);border-radius:var(--r);border:1px solid var(--line);box-shadow:0 20px 60px rgba(20,10,5,.4);padding:24px}
.modal h3{font-family:var(--serif);font-size:22px;font-weight:600;margin:0 0 16px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}

.form input[type=text],.form input[type=date],.form input[type=number],.form select,.form textarea{border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:#FBF7F1;font-size:14px;color:var(--ink);font-weight:400;width:100%}
.form textarea{min-height:76px;resize:vertical}
.form .checks{display:flex;flex-wrap:wrap;gap:6px 14px;font-weight:400;color:var(--ink);font-size:13.5px}
.form .checks label{display:inline-flex;gap:6px;align-items:center}
.form .hint{font-weight:400;font-size:12px}
.form-err{grid-column:1/-1;color:var(--red-ink);background:var(--red-soft);border-radius:10px;padding:8px 12px;font-size:13px}
.modal-foot{display:flex;justify-content:space-between;gap:10px;margin-top:20px;flex-wrap:wrap}
.modal-foot .r{display:flex;gap:8px;margin-left:auto}
.confirm-row{display:flex;gap:8px;align-items:center;font-size:13px;flex-wrap:wrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--card);color:var(--ink);border:1px solid var(--line);border-left:3px solid var(--green);border-radius:14px;padding:10px 16px;box-shadow:var(--shadow);font-weight:500;max-width:calc(100% - 32px);animation:tin .25s ease}
.toast.err{border-left-color:var(--red)}
@keyframes tin{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
.suggest{border-left:3px solid var(--rose);padding:14px 16px;border-radius:12px;background:var(--card-hi);border-top:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}

<script>
/* =====================================================================
   STARTDATA

  ],

  meta: [
    { id: "settings", totalBudget: 25000, totalNote: "fra HVL Skape [BEKREFT beløp og om det er innvilget]" }

const TZ = "Europe/Oslo";
const WD = ["søn","man","tir","ons","tor","fre","lør"];
const WDL = ["søndag","mandag","tirsdag","onsdag","torsdag","fredag","lørdag"];
const MON = ["jan","feb","mar","apr","mai","jun","jul","aug","sep","okt","nov","des"];
const MONL = ["januar","februar","mars","april","mai","juni","juli","august","september","oktober","november","desember"];
function todayISO() {
  return new Intl.DateTimeFormat("en-CA", { timeZone: TZ, year: "numeric", month: "2-digit", day: "2-digit" }).format(new Date());
}
const toUTC = iso => { const [y, m, d] = iso.split("-").map(Number); return Date.UTC(y, m - 1, d); };
const dOf = iso => new Date(toUTC(iso));
const daysUntil = iso => Math.round((toUTC(iso) - toUTC(todayISO())) / 864e5);
const addDays = (iso, n) => new Date(toUTC(iso) + n * 864e5).toISOString().slice(0, 10);
function isoWeek(iso) {
  const d = dOf(iso); const day = (d.getUTCDay() + 6) % 7;
  d.setUTCDate(d.getUTCDate() - day + 3);
  const y = d.getUTCFullYear(); const jan4 = new Date(Date.UTC(y, 0, 4));
  return 1 + Math.round(((d - jan4) / 864e5 - 3 + ((jan4.getUTCDay() + 6) % 7)) / 7);
}
const isoWeekYear = iso => { const d = dOf(iso); d.setUTCDate(d.getUTCDate() - ((d.getUTCDay() + 6) % 7) + 3); return d.getUTCFullYear(); };
const weekKey = iso => isoWeekYear(iso) + "-W" + String(isoWeek(iso)).padStart(2, "0");
const mondayOf = iso => addDays(iso, -((dOf(iso).getUTCDay() + 6) % 7));
function fmtDate(iso, wd = true) { const d = dOf(iso); return (wd ? WD[d.getUTCDay()] + " " : "") + d.getUTCDate() + ". " + MON[d.getUTCMonth()]; }
function fmtRange(a, b) {
  const da = dOf(a), db = dOf(b);
  if (da.getUTCMonth() === db.getUTCMonth()) return da.getUTCDate() + ".–" + db.getUTCDate() + ". " + MON[db.getUTCMonth()];
  return fmtDate(a, false) + " – " + fmtDate(b, false);
}
function relText(n) { if (n === 0) return "I dag"; if (n === 1) return "I morgen"; if (n < 0) return (-n) + " d over"; return n + " d"; }

/* ---------- Supabase ----------
   Den offentlige nøkkelen er ment å ligge i nettleseren. Tilgangen styres av
   innloggingen og reglene (RLS) i databasen: bare e-postadressene på teamets
   liste kan lese og skrive. */
const SUPABASE_URL = "https://zgflofmkcuvgaehsfixe.supabase.co";
const SUPABASE_KEY = "sb_publishable_jYWPoa076ydyD_OxsGerWA_AIQ5zXUk";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const BUCKET = "files";

const queues = {};
function dbErr(e) {
  const code = e && (e.code || e.status);
  if (code === "42501" || code === 401 || code === 403) toast("Endringen ble ikke lagret. Du er logget ut eller mangler tilgang. Last siden på nytt.", true);
  else toast("Kunne ikke lagre akkurat nå. Sjekk nettet og prøv igjen.", true);
  setSync("Lagringsfeil", "warn");
}
function enqueue(key, fn) {
  const prev = queues[key] || Promise.resolve();
  const next = prev.then(fn).catch(dbErr);
  queues[key] = next; return next;
}
async function must(q) { const { error } = await q; if (error) throw error; }
function put(c, obj) {
  const o = clone(obj); S[c][o.id] = o;
  setSync("Lagrer …", "");
  enqueue(c + "/" + o.id, () => must(sb.from("docs").upsert({ coll: c, id: o.id, data: o })).then(() => setSync("Delt · lagret", "ok")));
  render();
}
function del(c, id) {
  delete S[c][id];
  enqueue(c + "/" + id, () => must(sb.from("docs").delete().match({ coll: c, id })));
  render();
}
function setSync(text, cls) { UI.sync = text; UI.syncCls = cls; const el = document.getElementById("syncline"); if (el) { el.className = "sync " + (cls || ""); el.lastChild.textContent = " " + text; } }

/* Hent alle data én gang, og hold dem oppdatert i sanntid */
const docOf = r => { const d = Object.assign(clone(r.data || {}), { id: r.id }); if (r.coll === "tasks") normTask(d); return d; };
const skipRow = r => !COLLS.includes(r.coll) || (r.coll === "meta" && r.id === "seed");
async function loadAll() {
  const rows = [];
  for (let from = 0; ; from += 1000) {
    const { data, error } = await sb.from("docs").select("coll,id,data").order("coll").order("id").range(from, from + 999);
    if (error) throw error;
    rows.push(...data); if (data.length < 1000) break;
  }
  for (const c of COLLS) S[c] = {};
  rows.forEach(r => { if (!skipRow(r)) S[r.coll][r.id] = docOf(r); });
}
let renderQueued = false;
function scheduleRender() { if (renderQueued) return; renderQueued = true; requestAnimationFrame(() => { renderQueued = false; render(); }); }
function subscribe() {
  sb.channel("docs").on("postgres_changes", { event: "*", schema: "public", table: "docs" }, p => {
    if (p.eventType === "DELETE") { const o = p.old || {}; if (S[o.coll]) delete S[o.coll][o.id]; }
    else { const r = p.new; if (skipRow(r)) return; S[r.coll][r.id] = docOf(r); }
    scheduleRender();
  }).subscribe(status => {
    if (status === "SUBSCRIBED") setSync("Delt · lagret", "ok");
    else if (status === "CHANNEL_ERROR" || status === "TIMED_OUT") setSync("Mistet forbindelsen – last siden på nytt", "warn");
  });
}

async function uploadFile(file) {
  const ext = (file.name.split(".").pop() || "").toLowerCase();
  if (!UPLOAD_TYPES[ext]) throw new Error("Filtypen støttes ikke. Bruk PDF, Word (.docx), bilde eller tekstfil, eller lim inn en lenke.");
  if (file.size > 20 * 1024 * 1024) throw new Error("Filen er for stor. Maks 20 MB.");
  // Filnavnet brukes ikke i lagringsstien, siden det kan inneholde navn og spesialtegn
  const path = uid("f") + "." + ext;
  const { error } = await sb.storage.from(BUCKET).upload(path, file, { contentType: UPLOAD_TYPES[ext], upsert: false });

  return { id: path, name: file.name };

const VIEWS = {};

/* ----- HJEM ----- */
VIEWS.hjem = function () {
  const today = todayISO();
  const over = t => t.due && daysUntil(t.due) < 0 ? 1 : 0;
  // Ukens viktigste oppgaver: regnes ut automatisk. Forfalte først, så prioritet og frist.
  const openAll = tasks().filter(t => !isDone(t));
  const top = openAll.slice().sort((a, b) => over(b) - over(a) || byPrioDue(a, b)).slice(0, 5);
  const topHtml = taskRows(top);
  const topCard = `<div class="card"><div class="card-head"><div><h2>Ukens viktigste oppgaver</h2><p class="sub">Regnes ut fra prioritet og frist. Forfalte øverst.</p></div><span class="mono muted">${top.length}/${openAll.length}</span></div>
    <div class="scroll-list">${topHtml || `<div class="empty">Ingen åpne oppgaver. Godt jobbet!</div>`}</div>
    ${openAll.length > top.length ? `<div class="card-foot">${miniBtn("go", `Se alle oppgaver (${openAll.length})`, 'data-p="oppgaver"')}</div>` : ""}</div>`;

  // Frister
  const mon = addDays(mondayOf(today), UI.weekOffset * 7), sun = addDays(mon, 6);
  const inWeek = iso => iso && toUTC(iso) >= toUTC(mon) && toUTC(iso) <= toUTC(sun);
  const items = [];
  milestones().forEach(m => { if (!m.date) return; const s = m.date, e = m.end || m.date; if (toUTC(e) >= toUTC(mon) && toUTC(s) <= toUTC(sun)) items.push({ kind: "ms", date: toUTC(s) < toUTC(mon) ? mon : s, m }); });
  const isCur = UI.weekOffset === 0;
  tasks().forEach(t => { if (!isDone(t) && t.due && (inWeek(t.due) || (isCur && toUTC(t.due) < toUTC(mon)))) items.push({ kind: "t", date: t.due, t }); });
  items.sort((a, b) => toUTC(a.date) - toUTC(b.date) || (a.kind === "ms" ? -1 : 1));
  const fristHtml = items.map(it => {
    if (it.kind === "ms") {
      const m = it.m, tone = msTone(m), d = daysUntil(m.date);
      const badge = m.status === "Levert" ? "Levert" : (m.end && d < 0 && daysUntil(m.end) >= 0) ? "Pågår" : relText(d);
      return `<div class="lrow ms" data-act="editMs" data-id="${m.id}"><span class="lt"><b>${esc(m.title)}</b><small><span class="mono">${m.end ? fmtRange(m.date, m.end) : fmtDate(m.date)}</span> · ${esc(m.type)}</small></span><span class="badge t-${tone}">${badge}</span></div>`;
    }
    const t = it.t, d = daysUntil(t.due);
    const tone = taskTone(t), edge = tone === "red" ? "var(--red)" : tone === "orange" ? "var(--orange)" : "var(--green)";
    return `<div class="lrow" data-act="editTask" data-id="${t.id}" style="border-left:3px solid ${edge}"><span class="lt"><b>${ph(t.title)}</b><small><span class="mono">${fmtDate(t.due)}</span> · ${ownersText(t)}</small></span><span class="badge t-${tone}">${d < 0 ? "Forfalt " + (-d) + " d" : relText(d)}</span></div>`;
  }).join("");
  const fristCard = `<div class="card"><div class="card-head"><div><h2>Frister</h2><p class="sub">${UI.weekOffset === 0 ? "Denne uken, med forfalte øverst" : UI.weekOffset === 1 ? "Neste uke" : UI.weekOffset === -1 ? "Forrige uke" : (UI.weekOffset > 0 ? "Om " + UI.weekOffset + " uker" : "For " + (-UI.weekOffset) + " uker siden")}</p></div>
    <div class="weeknav"><button class="iconbtn" data-act="week" data-d="-1" aria-label="Forrige uke">${ico("left", 2.2)}</button><button class="iconbtn" data-act="week" data-d="1" aria-label="Neste uke">${ico("right", 2.2)}</button></div></div>
    <div class="weeklabel">Uke ${isoWeek(mon)} · ${fmtRange(mon, sun)}</div>
    <div class="scroll-list">${fristHtml || `<div class="empty">Ingen frister denne uken.</div>`}</div></div>`;

  // Hvor står vi: én linje per område
  const statusCard = `<div class="card"><div class="card-head"><div><h2>Hvor står vi?</h2><p class="sub">Én linje per område. Klikk for detaljer, og oppdater statusen der.</p></div></div>
    <div class="srows">${AREAS.map(a => {
      const st = S.areas[a.id] || {}, nt = areaTasks(a.id)[0];
      return `<div class="srow" data-act="go" data-p="${a.id}" tabindex="0"><span class="sname">${ico(a.icon)}${esc(a.name)}</span>${lightPill(st.light)}
        <span class="stext" title="${esc(st.text || "")}">${st.text ? ph(st.text) : '<span class="muted">Ingen status skrevet</span>'}</span>
        <span class="snext">${nt ? `<span class="muted">Neste:</span> ${ph(nt.title)}` : '<span class="muted">Ingen åpne oppgaver</span>'}</span></div>`;
    }).join("")}</div></div>`;

  return `<div class="grid-top">${topCard}${fristCard}</div>
    ${goalsCard()}
    ${statusCard}
    ${followUpCard()}`;
};

/* ---------- Grafer ---------- */
function pilotDots(n) {

}
function ringSvg(pct, big, small, color) {

    <circle cx="55" cy="55" r="46" fill="none" stroke="${color || "var(--bar)"}" stroke-width="10" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - Math.max(0, Math.min(100, pct)) / 100)}" transform="rotate(-90 55 55)"/>
    <text x="55" y="54" text-anchor="middle" font-family="JetBrains Mono, monospace" font-weight="700" font-size="21" fill="var(--ink)">${big}</text>

}
function gaugeSvg(pct, big, small) {

    <path d="M12 62 A48 48 0 0 1 108 62" fill="none" stroke="var(--track)" stroke-width="11" stroke-linecap="round"/>
    ${p > 0 ? "" : "<!--"}<path d="M12 62 A48 48 0 0 1 108 62" fill="none" stroke="${p > 90 ? "var(--red)" : p > 70 ? "var(--orange)" : "var(--bar)"}" stroke-width="11" stroke-linecap="round" pathLength="100" stroke-dasharray="${p} 100"/>${p > 0 ? "" : "-->"}
    <text x="60" y="54" text-anchor="middle" font-family="JetBrains Mono, monospace" font-weight="700" font-size="16" fill="var(--ink)">${big}</text>
    <text x="60" y="69" text-anchor="middle" font-family="Inter, sans-serif" font-size="8.5" fill="var(--muted)">${small}</text></svg>`;
}
function goalsCard() {
  const all = tasks(), pay = paying().length, rev = paying().reduce((s, l) => s + num(l.price), 0);
  // Pilot
  const pilot = `<section class="gt"><span class="eyebrow">Pilot · mål ${PILOT_GOAL} familier</span>${pilotDots(pay)}
    <div class="gt-big"><b class="mono">${pay}</b> av ${PILOT_GOAL} betaler</div><p class="sub">${pay ? kr(rev) + " i omsetning" : "Første betalende familie er neste store steg."}</p></section>`;
  // Neste milepæl
  const nd = nextDeadline();
  let next = `<section class="gt"><span class="eyebrow">Neste milepæl</span><div class="empty">Ingen flere milepæler.</div></section>`;
  if (nd) {
    const p = msProgress(nd), d = daysUntil(nd.date), ongoing = d < 0 && nd.end && daysUntil(nd.end) >= 0;
    const tone = ongoing ? "var(--orange)" : d < 0 ? "var(--red)" : d <= 7 ? "var(--orange)" : "var(--green)";
    next = `<section class="gt center"><span class="eyebrow">Neste milepæl</span>${p.total ? ringSvg(p.pct, p.pct + "%", `${p.done} av ${p.total} oppg.`) : ringSvg(0, ongoing ? "nå" : Math.max(0, d) + " d", ongoing ? "pågår" : "til " + esc(nd.type.toLowerCase()))}
      <div class="rn">${esc(nd.title)}</div><span class="badge" style="background:${tone};color:#fff">${ongoing ? "Pågår nå" : d < 0 ? (-d) + " dager over" : d === 0 ? "I dag" : d + (d === 1 ? " dag" : " dager") + " igjen"}</span></section>`;
  }
  // Milepæler fremover: tidslinje + fremdrift
  const today = todayISO();
  const up = milestones().filter(m => m.date && m.status !== "Levert" && toUTC(m.end || m.date) >= toUTC(today)).slice(0, 5);
  let tl = "";
  if (up.length) {
    const t0 = toUTC(today), t1 = Math.max(...up.map(m => toUTC(m.date))), span = Math.max(1, t1 - t0);
    // Plassering etter dato, men med minsteavstand så prikkene ikke overlapper
    const xs = up.map(m => 18 + Math.max(0, (toUTC(m.date) - t0) / span) * 74), gap = 9;
    for (let i = 1; i < xs.length; i++) xs[i] = Math.max(xs[i], xs[i - 1] + gap);
    for (let i = xs.length - 1; i >= 0; i--) xs[i] = Math.min(xs[i], i === xs.length - 1 ? 92 : xs[i + 1] - gap);
    tl = `<div class="mtl"><div class="mtl-line"></div><span class="mtl-today" style="left:6%">I dag</span>${up.map((m, i) => `<span class="mtl-dot" style="left:${xs[i]}%" title="${esc(m.title)}">${i + 1}</span>`).join("")}</div>
      <div class="mini-list">${up.map((m, i) => { const p = msProgress(m), d = daysUntil(m.date);
        return `<div class="mrow" data-act="editMs" data-id="${m.id}"><span class="mnum">${i + 1}</span><span class="mt">${esc(m.title)}<small class="mono">${fmtDate(m.date, false)} · ${d < 0 ? "pågår" : d + " d"}</small></span>${p.total ? `<span class="mbar" title="${p.done} av ${p.total} oppgaver">${bar(p.pct, p.pct === 100 ? "green" : "")}</span>` : `<span class="muted mtype">${esc(m.type)}</span>`}</div>`; }).join("")}</div>`;
  }
  const timeline = `<section class="gt wide"><span class="eyebrow">Milepæler fremover</span>${tl || '<div class="empty">Ingen daterte milepæler fremover.</div>'}</section>`;
  // Oppgaver: stablet søyle per status

  const colors = ["#CDBBA4", "var(--orange)", "var(--green)"];
  const od = overdue().length;
  const tasksTile = `<section class="gt"><span class="eyebrow">Oppgaver</span>
    <div class="gt-big"><b class="mono">${cnt[2]}</b> av ${all.length} ferdig</div>
    <div class="stack-bar">${cnt.map((c, i) => c ? `<i style="width:${c / tot * 100}%;background:${colors[i]}" title="${STATUSES[i]}: ${c}"></i>` : "").join("")}</div>
    <div class="legend">${STATUSES.map((s, i) => `<span><i style="background:${colors[i]}"></i>${s} <b class="mono">${cnt[i]}</b></span>`).join("")}</div>
    ${od ? `<p class="sub" style="color:var(--red-ink)">${od} forfalt</p>` : ""}</section>`;
  // Team: søyler per person (pågår + ferdig) og ufordelte
  const per = PEOPLE.map(p => ({ p, run: all.filter(t => t.status === "Pågår" && ownersOf(t).includes(p)).length, done: all.filter(t => isDone(t) && ownersOf(t).includes(p)).length }));
  const mx = Math.max(1, ...per.map(o => o.run + o.done)), H = 70;
  const cols = per.map((o, i) => {
    const x = 14 + i * 46, hr = o.run / mx * H, hd = o.done / mx * H, y0 = 84;
    return `<rect x="${x}" y="${y0 - hd}" width="26" height="${hd}" rx="3" fill="var(--green)"/><rect x="${x}" y="${y0 - hd - hr}" width="26" height="${hr}" rx="3" fill="var(--bar)"/>
      <text x="${x + 13}" y="${y0 - hd - hr - 4}" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" fill="var(--ink)">${o.run + o.done}</text>
      <text x="${x + 13}" y="98" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="var(--muted)">${esc(o.p)}</text>`;
  }).join("");
  const unas = all.filter(t => !isDone(t) && !ownersOf(t).length).length;
  const team = `<section class="gt"><span class="eyebrow">Team</span>
    <svg viewBox="0 0 200 104" class="team-svg" role="img" aria-label="Oppgaver per person"><line x1="6" y1="84.5" x2="194" y2="84.5" stroke="var(--line)"/>${cols}</svg>
    <div class="legend"><span><i style="background:var(--bar)"></i>Pågår</span><span><i style="background:var(--green)"></i>Ferdig</span><span>${unas} ikke tatt</span></div></section>`;
  // Økonomi: halvsirkel for budsjett
  const set = S.meta.settings || { totalBudget: 0, totalNote: "" }, spent = totalSpent();
  const money = `<section class="gt center"><span class="eyebrow">Budsjett</span>${gaugeSvg(set.totalBudget ? spent / set.totalBudget * 100 : 0, kr(spent), "brukt av " + kr(set.totalBudget))}
    ${hasPh(set.totalNote) ? '<span class="ph">Rammen er ikke bekreftet</span>' : ""}<p class="sub">Saldo i lommeboka: <b class="mono">${kr(walletBalance())}</b></p></section>`;
  return `<div class="card"><div class="card-head"><div><h2>Mål og fremdrift</h2><p class="sub">De viktigste målene for semesteret</p></div></div>
    <div class="tiles">${incomeSection()}${pilot}${timeline}${areaDonut()}${team}</div></div>`;
}

/* ---------- Totale inntekter (linjediagram) ---------- */
const INC_RANGES = [["1M", "1 mnd", 30], ["3M", "3 mnd", 91], ["6M", "6 mnd", 182], ["HIA", "Hittil i år", 0], ["1A", "1 år", 365], ["ALT", "Alt", -1]];
let INC = null; // siste tegnede serie, brukes av hover
function incomeEvents() {
  const ev = [];
  arr("wallet").filter(w => w.type === "Inn" && num(w.amount) > 0).forEach(w => ev.push({ date: w.date || todayISO(), amount: num(w.amount), label: w.text || "Innbetaling" }));
  paying().forEach(l => { if (num(l.price) > 0) ev.push({ date: l.pilotStart || l.date || todayISO(), amount: num(l.price), label: "Salg: " + (l.family || "pilotfamilie") }); });
  return ev.sort((a, b) => toUTC(a.date) - toUTC(b.date));
}
function niceMax(v) { const p = Math.pow(10, Math.floor(Math.log10(Math.max(1, v)))); for (const m of [1, 2, 2.5, 5, 10]) if (m * p >= v) return m * p; return 10 * p; }
const krShort = v => v >= 1000 ? (v / 1000).toLocaleString("nb-NO", { maximumFractionDigits: 1 }) + "k" : String(Math.round(v));
function incomeSection() {
  const today = todayISO(), ev = incomeEvents(), key = UI.incRange || "ALT", r = INC_RANGES.find(x => x[0] === key) || INC_RANGES[5];
  let start = r[2] > 0 ? addDays(today, -r[2]) : r[2] === 0 ? today.slice(0, 4) + "-01-01" : (ev.length ? addDays(ev[0].date, -7) : addDays(today, -60));
  if (toUTC(start) > toUTC(today)) start = today;
  const days = Math.max(1, Math.round((toUTC(today) - toUTC(start)) / 864e5));
  const before = ev.filter(e => toUTC(e.date) < toUTC(start)).reduce((s, e) => s + e.amount, 0);
  const inR = ev.filter(e => toUTC(e.date) >= toUTC(start) && toUTC(e.date) <= toUTC(today));
  const pts = []; let cum = before, i = 0;
  for (let d = 0; d <= days; d++) { const iso = addDays(start, d); while (i < inR.length && toUTC(inR[i].date) <= toUTC(iso)) { cum += inR[i].amount; i++; } pts.push([iso, cum]); }
  const gain = cum - before, pct = before > 0 ? gain / before * 100 : null;
  const W = (window.innerWidth || 1200) < 700 ? 420 : 720, H = 170, L = 50, Rr = 16, T = 14, B = 30, maxV = niceMax(Math.max(cum, 1000));
  const X = d => L + d / days * (W - L - Rr), Y = v => T + (1 - v / maxV) * (H - T - B);
  INC = { pts, days, X, Y, L, Rr, W };
  const line = pts.map((p, d) => `${d ? "L" : "M"}${X(d).toFixed(1)} ${Y(p[1]).toFixed(1)}`).join(" ");
  const area = `${line} L${X(days).toFixed(1)} ${Y(0)} L${X(0)} ${Y(0)} Z`;
  const grid = [0, .25, .5, .75, 1].map(f => { const v = maxV * f, y = Y(v); return `<line x1="${L}" x2="${W - Rr}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-width="1"/><text x="${L - 8}" y="${y + 4}" text-anchor="end" font-family="Inter, sans-serif" font-size="10.5" fill="var(--muted)">${krShort(v)}</text>`; }).join("");
  let xl = "";
  if (days > 75) { pts.forEach((p, d) => { if (p[0].endsWith("-01") || d === 0) { const m = dOf(p[0]); xl += `<text x="${X(d)}" y="${H - 8}" text-anchor="${d === 0 ? "start" : "middle"}" font-family="Inter, sans-serif" font-size="10.5" fill="var(--muted)">${MON[m.getUTCMonth()][0].toUpperCase() + MON[m.getUTCMonth()].slice(1)}</text>`; } }); }
  else { const step = days > 35 ? 14 : 7; for (let d = 0; d <= days; d += step) xl += `<text x="${X(d)}" y="${H - 8}" text-anchor="${d === 0 ? "start" : "middle"}" font-family="Inter, sans-serif" font-size="10.5" fill="var(--muted)">${fmtDate(pts[d][0], false)}</text>`; }
  const dots = inR.map(e => { const d = Math.round((toUTC(e.date) - toUTC(start)) / 864e5); return `<circle cx="${X(d)}" cy="${Y(pts[d][1])}" r="3" fill="var(--inc)" opacity=".55"><title>${esc(e.label)}: ${kr(e.amount)}</title></circle>`; }).join("");
  const chg = gain > 0 ? `<span class="inc-chg up">↗ ${kr(gain)}${pct != null ? ` (${pct.toLocaleString("nb-NO", { maximumFractionDigits: 1 })} %)` : ""}</span>` : `<span class="inc-chg">Ingen nye inntekter</span>`;
  return `<section class="gt span-2 inc"><div class="inc-head"><div><span class="eyebrow">Totale inntekter</span><div class="inc-big">${kr(cum)}</div><div class="inc-sub">${chg} <span class="muted">${esc(r[1].toLowerCase())}</span></div></div>
      <p class="sub" style="max-width:30ch;text-align:right;font-size:12px">Innbetalinger og salg, summert over tid</p></div>
    <div class="inc-chart"><svg viewBox="0 0 ${W} ${H}" class="inc-svg" role="img" aria-label="Totale inntekter ${kr(cum)}">
      <defs><linearGradient id="incfill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--inc)" stop-opacity=".28"/><stop offset="1" stop-color="var(--inc)" stop-opacity="0"/></linearGradient></defs>
      ${grid}<path d="${area}" fill="url(#incfill)"/><path d="${line}" fill="none" stroke="var(--inc)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>${dots}
      <circle cx="${X(days)}" cy="${Y(cum)}" r="5.5" fill="var(--inc)" stroke="var(--card-hi)" stroke-width="2"/>${xl}
      <line class="inc-hl" x1="0" x2="0" y1="${T}" y2="${H - B}" stroke="var(--muted)" stroke-dasharray="3 3" opacity="0"/><circle class="inc-hd" r="4.5" fill="var(--inc)" opacity="0"/>
      <rect x="${L}" y="${T}" width="${W - L - Rr}" height="${H - T - B}" fill="transparent" class="inc-hit"/></svg>
      <div class="inc-tip" hidden></div>
      ${ev.length ? "" : '<div class="inc-empty">Ingen inntekter registrert ennå. Legg inn innbetalinger i lommeboka, eller registrer salg til pilotfamilier.</div>'}</div>
    <div class="seg-range" role="group" aria-label="Periode">${INC_RANGES.map(([k, l]) => `<button class="${k === key ? "on" : ""}" data-act="incRange" data-r="${k}">${l}</button>`).join("")}</div></section>`;
}
function incomeHover(ev) {
  const svg = ev.target.closest && ev.target.closest(".inc-svg"); if (!svg || !INC) return;
  const box = svg.getBoundingClientRect(), vx = (ev.clientX - box.left) / box.width * INC.W;
  const d = Math.max(0, Math.min(INC.days, Math.round((vx - INC.L) / (INC.W - INC.L - INC.Rr) * INC.days)));
  const [iso, v] = INC.pts[d], x = INC.X(d), y = INC.Y(v);
  const hl = svg.querySelector(".inc-hl"), hd = svg.querySelector(".inc-hd"), tip = svg.parentElement.querySelector(".inc-tip");
  hl.setAttribute("x1", x); hl.setAttribute("x2", x); hl.setAttribute("opacity", ".7"); hd.setAttribute("cx", x); hd.setAttribute("cy", y); hd.setAttribute("opacity", "1");
  tip.hidden = false; tip.innerHTML = `<b class="mono">${kr(v)}</b><span>${fmtDate(iso)}</span>`;
  tip.style.left = Math.min(box.width - 120, Math.max(0, x / INC.W * box.width - 55)) + "px"; tip.style.top = Math.max(0, y / 170 * box.height - 58) + "px";
}
function incomeLeave(ev) {
  const svg = ev.target.closest && ev.target.closest(".inc-svg"); if (!svg) return;
  svg.querySelector(".inc-hl").setAttribute("opacity", "0"); svg.querySelector(".inc-hd").setAttribute("opacity", "0");
  const tip = svg.parentElement.querySelector(".inc-tip"); if (tip) tip.hidden = true;

/* ---------- Åpne oppgaver per område (smultring) ---------- */
const AREA_COLOR = { produkt: "#7E9DB5", marked: "#C9A27A", jus: "#A9BCCB", finans: "#B07F5E", research: "#8EA487", kurs: "#D9C6A6" };
function areaDonut() {
  const open = tasks().filter(t => !isDone(t));
  const groups = [...AREAS.map(a => [a.id, a.name, AREA_COLOR[a.id], open.filter(t => t.area === a.id).length]), ["", "Uten område", "#CDBBA4", open.filter(t => !AREA[t.area]).length]].filter(g => g[3]).sort((a, b) => b[3] - a[3]);
  const tot = open.length, r = 40, C = 2 * Math.PI * r, gap = groups.length > 1 ? 1.6 : 0;
  let acc = 0;
  const segs = groups.map(([id, n, col, c]) => { const len = c / tot * C; const s = `<circle cx="55" cy="55" r="${r}" fill="none" stroke="${col}" stroke-width="17" stroke-dasharray="${Math.max(0, len - gap)} ${C}" stroke-dashoffset="${-acc}" transform="rotate(-90 55 55)"><title>${esc(n)}: ${c}</title></circle>`; acc += len; return s; }).join("");
  const top = groups[0];
  return `<section class="gt"><span class="eyebrow">Åpne oppgaver per område</span>
    <div class="donut-wrap"><svg viewBox="0 0 110 110" class="donut" role="img" aria-label="${tot} åpne oppgaver fordelt på områder"><circle cx="55" cy="55" r="${r}" fill="none" stroke="var(--track)" stroke-width="17"/>${segs}
      <text x="55" y="56" text-anchor="middle" font-family="JetBrains Mono, monospace" font-weight="700" font-size="20" fill="var(--ink)">${tot}</text><text x="55" y="70" text-anchor="middle" font-family="Inter, sans-serif" font-size="9.5" fill="var(--muted)">åpne</text></svg>
      <div class="dleg">${groups.map(([id, n, col, c]) => `<div class="dl" ${id ? `data-act="go" data-p="${id}"` : ""}><i style="background:${col}"></i><span>${esc(id ? AREA[id].short : n)}</span><b class="mono">${c}</b><span class="mono muted">${Math.round(c / tot * 100)}%</span></div>`).join("") || '<p class="sub">Ingen åpne oppgaver.</p>'}</div></div>

/* ----- OPPGAVER ----- */
function taskFilter(t) {
  const today = todayISO(), mon = mondayOf(today), sun = addDays(mon, 6);
  if (UI.areaFilter) { const [fa, fs] = UI.areaFilter.split("."); if (t.area !== fa || (fs && t.sub !== fs)) return false; }
  switch (UI.filter) {
    case "mine": return UI.me ? ownersOf(t).includes(UI.me) : true;
    case "unassigned": return !ownersOf(t).length;
    case "week": return t.due && toUTC(t.due) >= toUTC(mon) && toUTC(t.due) <= toUTC(sun);
    case "overdue": return !isDone(t) && t.due && daysUntil(t.due) < 0;
    default: return true;
  }
}
function kcard(t, from) {
  const own = ownersOf(t), todo = t.status === "Må gjøres";
  const step = todo ? (own.length ? "Start" : "Ta oppgaven") : NEXT_STEP[t.status][1];
  const who = (todo && !own.length) ? "" : `<button class="avbtn" data-act="assign" data-id="${t.id}" aria-label="Endre ansvarlige" title="${own.length ? "Ansvarlig: " + esc(joinNames(own)) + ". Klikk for å endre" : "Klikk for å fordele"}">${avatars(t, true)}</button>`;
  return `<div class="kc p-${esc(t.prio)}${isDone(t) ? " isdone" : ""}" draggable="true" data-drag="task" data-id="${t.id}" data-from="${esc(from || "")}" data-act="editTask" tabindex="0">
    ${isDone(t) ? `<span class="stamp">${ico("check", 3)}</span>` : ""}
    <div class="kt" style="${isDone(t) ? "padding-right:26px" : ""}">${ph(t.title)}</div>
    <div class="kf">${dueBadge(t)}${taskAreaTag(t)}${UI.boardMode === "owner" ? `<span class="pill s-${esc(t.status)}">${esc(t.status)}</span>` : ""}${who}</div>
    ${own.length && !todo ? `<div class="kown">${esc(joinNames(own))}</div>` : ""}

}

/* ----- MILEPÆLER ----- */
VIEWS.milepaeler = function () {
  const ms = milestones(), dated = ms.filter(m => m.date), undated = ms.filter(m => !m.date);
  const firstIso = dated.length ? dated.reduce((a, m) => toUTC(m.date) < toUTC(a) ? m.date : a, todayISO()) : todayISO();
  const lastIso = dated.reduce((a, m) => toUTC(m.end || m.date) > toUTC(a) ? (m.end || m.date) : a, todayISO());
  const start = mondayOf(firstIso), weeks = Math.ceil((toUTC(lastIso) - toUTC(start)) / 864e5 / 7) + 1, end = addDays(start, weeks * 7), span = weeks * 7;
  const step = weeks > 30 ? 4 : weeks > 16 ? 2 : 1;
  const pos = iso => Math.max(0, Math.min(100, (toUTC(iso) - toUTC(start)) / 864e5 / span * 100));
  let axis = "", grid = "";
  for (let w = 0; w <= weeks; w++) { const d = addDays(start, w * 7); const x = pos(d); if (w < weeks && w % step === 0) axis += `<span style="left:${pos(addDays(d, 3))}%">U${isoWeek(d)}</span>`; if (w % step === 0) grid += `<div class="tl-grid" style="left:${x}%"></div>`; }
  const today = todayISO();
  const rows = dated.map(m => {
    const x = pos(m.date), right = x > 68;
    const shape = m.end ? `<div class="tl-range" style="left:${x}%;width:${pos(m.end) - x}%"></div>` : `<div class="tl-mark" style="left:${x}%;${m.status === "Levert" ? "background:var(--green);box-shadow:0 0 0 1.5px var(--green)" : ""}"></div>`;
    const lx = right ? `right:${100 - x + 1.6}%` : `left:${(m.end ? pos(m.end) : x) + 1.6}%`;
    return `<div class="tl-row">${shape}<div class="tl-label" style="${lx}">${esc(m.title)}<small>${m.end ? fmtRange(m.date, m.end) : fmtDate(m.date, false)}</small></div></div>`;
  }).join("");
  const showToday = toUTC(today) >= toUTC(start) && toUTC(today) <= toUTC(end);
  const tl = `<div class="card"><div class="card-head"><div><h2>Tidslinje</h2><p class="sub">Uke ${isoWeek(start)} til uke ${isoWeek(lastIso)}</p></div></div>
    <div class="tl-scroll"><div class="tl" style="min-width:${Math.max(760, weeks * 38)}px"><div class="tl-axis">${axis}</div>${grid}${showToday ? `<div class="tl-today" style="left:${pos(today)}%"><span>I dag</span></div>` : ""}${rows}</div></div>
    ${undated.length ? `<p class="sub" style="margin-top:12px">Uten dato: ${undated.map(m => `${esc(m.title)} ${ph(m.dateText)}`).join(" · ")}</p>` : ""}</div>`;
  const nd = nextDeadline();
  const list = ms.map(m => {
    const p = msProgress(m), tone = msTone(m);
    let cd = "Dato mangler";
    if (m.status === "Levert") cd = "Levert";
    else if (m.date) { const d = daysUntil(m.date); cd = m.end && d < 0 && daysUntil(m.end) >= 0 ? "Pågår nå" : d === 0 ? "I dag" : d > 0 ? `Om ${d} ${d === 1 ? "dag" : "dager"}` : `For ${-d} dager siden`; }
    return `<div class="msrow${nd && nd.id === m.id ? " next" : ""}" data-act="editMs" data-id="${m.id}">
      <div class="msdate">${m.date ? `<b>${fmtDate(m.date, false)}</b><small>${WD[dOf(m.date).getUTCDay()]} · uke ${isoWeek(m.date)}</small>` : `<span class="ph">FYLL INN</span>`}</div>
      <div style="min-width:0"><b style="font-size:15px">${esc(m.title)}</b>${m.subtitle ? ` <span class="muted">– ${esc(m.subtitle)}</span>` : ""}
        <div class="msmeta"><span class="pill">${esc(m.type)}</span><span class="pill s-${esc(m.status)}">${esc(m.status)}</span><span class="badge t-${tone}">${cd}</span>${m.end ? `<span class="muted mono" style="font-size:12px">${fmtRange(m.date, m.end)}</span>` : ""}${!m.date ? ph(m.dateText) : ""}</div>
        ${m.note ? `<div class="muted" style="font-size:13px;margin-top:6px">${ph(m.note)}</div>` : ""}</div>
      <div class="msprog">${m.type === "Hendelse" ? "" : `<div class="mh"><span>Oppgaver</span><span class="mono">${p.total ? `${p.done}/${p.total} · ${p.pct} %` : m.status === "Levert" ? "100 %" : "ingen koblet"}</span></div>${bar(p.pct, p.pct === 100 ? "green" : "")}`}</div></div>`;
  }).join("");
  return tl + `<div class="mslist">${list}</div>`;
};

const CDOC_STATUS = ["Mangler", "Utkast", "Til signering", "Signert", "Utløpt"];

/* Vedlegg: filer lastes opp til Supabase Storage, lenker lagres som tekst */
function filesHtml(rec) {
  const fs = (rec.files || []).map(f => fileLink(f.id, f.name));
  if (isUrl(rec.link)) fs.push(`<a class="linkout" href="${esc(rec.link)}" target="_blank" rel="noopener">Lenke ↗</a>`);
  return fs.length ? `<div class="files">${fs.join("")}</div>` : '<span class="muted">–</span>';
}
function attachFields(rec, opts = {}) {
  return [
    { k: "file", label: "Legg ved fil", type: "file", accept: UPLOAD_ACCEPT, full: true, hint: UPLOAD_HINT },
    ...((rec.files || []).length ? [{ k: "removeFiles", label: "Fjern vedlegg", type: "multi", full: true, opts: rec.files.map(f => [f.id, f.name]) }] : []),
    ...(opts.noLink ? [] : [{ k: "link", label: "Lenke (Drive, Lovdata …)", full: true, ph: "https://" }])
  ];
}
async function applyAttach(o, v) {
  if (v.link && !isUrl(v.link)) return "Lenken må starte med https://";
  o.files = (o.files || []).filter(f => !(v.removeFiles || []).includes(f.id));
  if (v.file) {
    const btn = modalEl.querySelector('[data-act="saveModal"]'); btn.disabled = true; btn.textContent = "Laster opp …";
    try { o.files.push(await uploadFile(v.file)); } catch (e) { btn.disabled = false; btn.textContent = "Lagre"; return e.message; }
  }
  if ("link" in v) o.link = v.link || ""; delete o.file; delete o.removeFiles;
  return null;
}

  const lcol = ["var(--orange)", "#CDBBA4", "var(--green)"];

    <section class="gt"><span class="eyebrow">Juridiske spørsmål</span><div class="gt-big"><b class="mono">${lc[2]}</b> av ${ls.length} avklart</div>
      <div class="stack-bar">${lc.map((c, i) => c ? `<i style="width:${c / tot * 100}%;background:${lcol[i]}"></i>` : "").join("")}</div>
      <div class="legend">${LEGAL_STATUS.map((s, i) => `<span><i style="background:${lcol[i]}"></i>${s} <b class="mono">${lc[i]}</b></span>`).join("")}</div>
      <div class="mini-list">${open.map(l => `<div class="mrow" data-act="editLegal" data-id="${l.id}"><span class="mt">${esc(l.question)}<small>${esc(l.status)}${l.owner ? " · " + esc(l.owner) : ""}</small></span></div>`).join("")}</div>
      ${miniBtn("go", "Åpne juridiske spørsmål", 'data-p="jus.jus"')}</section>
    <section class="gt"><span class="eyebrow">Selskapsdokumenter</span><div class="gt-big"><b class="mono">${ds.filter(d => d.status === "Signert").length}</b> av ${ds.length} signert</div>
      <div class="mini-list">${need.map(d => `<div class="mrow" data-act="editCdoc" data-id="${d.id}"><span class="mt">${esc(d.title)}<small>${esc(d.kind || "")}</small></span>${d.status ? `<span class="badge ${CDOC_TONE[d.status]}">${esc(d.status)}</span>` : '<span class="ph">[BEKREFT status]</span>'}</div>`).join("") || '<p class="sub">Ingen dokumenter som mangler eller venter.</p>'}</div>

  </div></div>`;
